  const costoTotal7ma = total7ma * costoRemera7ma;
  const ventaRemeras7maTransf = total7ma * precioTransferencia7ma;
  const ventaRemeras7maEfec = total7ma * precioEfectivo7ma;
  const ventaRemeras7ma = (ventaRemeras7maTransf + ventaRemeras7maEfec) / 2; // promedio, usado en los totales
  const gananciaRemeras7maTransf = ventaRemeras7maTransf - costoTotal7ma;
  const gananciaRemeras7maEfec = ventaRemeras7maEfec - costoTotal7ma;
  const gananciaRemeras7ma = ventaRemeras7ma - costoTotal7ma;
  const vendiblesJuego = Math.max(0, totalJuego - unidadesCampeones);
  const ventaJuegoTransf = totalJuego * precioTransferenciaJuego;
  const ventaJuegoEfec = totalJuego * precioEfectivoJuego;
  const gananciaJuego = (ventaJuegoTransf + ventaJuegoEfec) / 2; // promedio, usado en los totales
  const ventaChoris = porcionesChoris * precioChoripan;
  const costoChorisTotal = 0; // el costo ahora se carga en Insumos
  const gananciaChoris = ventaChoris;
  const ventaHamburguesas = porcionesHamburguesas * precioHamburguesa;
  const costoHamburguesasTotal = 0; // el costo ahora se carga en Insumos
  const gananciaHamburguesas = ventaHamburguesas;
  const ventaFernet = fernet500Precio * fernet500Cant + fernet1LPrecio * fernet1LCant;
  const ventaAmargo = amargo500Precio * amargo500Cant + amargo1LPrecio * amargo1LCant;
  const ventaGaseosaBeb = gaseosaBeb500Precio * gaseosaBeb500Cant + gaseosaBeb1LPrecio * gaseosaBeb1LCant;
  const totalBebidas = ventaFernet + ventaAmargo + ventaGaseosaBeb; // venta
  const costoInsumosTotal = insumoItems.reduce((a, b) => a + (Number(b.cantidad) || 0) * (Number(b.costo) || 0), 0);
  const totalSponsors = aporteSponsor * 3;
  const costoKitTotal = kitItems.reduce((a, b) => a + (b.precio || 0), 0) * equipos;
  const costoManualTotal = manualItems.reduce((a, b) => a + (Number(b.precio) || 0), 0);
  const totalInscripcionConKit = totalInscripcion - costoKitTotal;
  const totalIngresos = recaudadoSorteo + totalInscripcion + ventaRemeras7ma + gananciaJuego + ventaChoris + ventaHamburguesas + totalBebidas + totalSponsors;
  const totalEgresos = costoTotal7ma + costoKitTotal + costoManualTotal + costoInsumosTotal;
  const gananciaTotal = totalIngresos - totalEgresos;
  const saldoFinal = capitalInicial + gananciaTotal;

  const saveLabel = saveStatus === "saving" ? "💾 Guardando..." : saveStatus === "saved" ? "✓ Guardado" : saveStatus === "error" ? "⚠ Error al guardar" : "";

  function descargarListaCompras() {
    const lineas = [];
    lineas.push("LISTA DE COMPRAS — EL URQUI BÁSQUET 7MA EDICIÓN");
    lineas.push("Generada automáticamente a partir de lo cargado en la app");
    lineas.push("=".repeat(50));

    if (total7ma > 0) {
      lineas.push("");
      lineas.push("REMERAS");
      lineas.push(`Remeras 7ma Algodón — ${total7ma} u. x ${fmt(costoRemera7ma)} = ${fmt(costoTotal7ma)}`);
    }

    const insumosConCantidad = insumoItems.filter(i => i.cantidad > 0);
    if (insumosConCantidad.length > 0) {
      lineas.push("");
      lineas.push("INSUMOS DE GASTRONOMÍA");
      insumosConCantidad.forEach(item => {
        let linea = `${item.desc || "(sin descripción)"} — ${item.cantidad} u. x ${fmt(item.costo)} = ${fmt(item.cantidad * item.costo)}`;
        if (item.obs) linea += ` (${item.obs})`;
        lineas.push(linea);
      });
    }

    if (kitItems.length > 0) {
      lineas.push("");
      lineas.push(`KIT POR EQUIPO (x ${equipos} equipos)`);
      kitItems.forEach(item => {
        lineas.push(`${item.desc || "(sin descripción)"} — ${fmt(item.precio)}/equipo x ${equipos} = ${fmt(item.precio * equipos)}`);
      });
    }

    if (manualItems.length > 0) {
      lineas.push("");
      lineas.push("GASTOS VARIOS");
      manualItems.forEach(item => {
        let linea = `${item.desc || "(sin descripción)"} — ${fmt(item.precio)}`;
        if (item.obs) linea += ` (${item.obs})`;
        lineas.push(linea);
      });
    }

    lineas.push("");
    lineas.push("=".repeat(50));
    lineas.push(`TOTAL A COMPRAR: ${fmt(costoTotal7ma + costoInsumosTotal + costoKitTotal + costoManualTotal)}`);

    const texto = lineas.join("\n");
    const blob = new Blob([texto], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "lista-de-compras-urqui.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const saveColor = saveStatus === "saved" ? VERDE : saveStatus === "error" ? ROJO : MUTED;

  if (!loaded) return (
    <div style={{ background: NEGRO, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: MUTED, fontFamily: FONT, fontSize: 13 }}>
      Cargando datos guardados...
    </div>
  );

  return (
    <div style={{ background: NEGRO, minHeight: "100vh", color: BLANCO, fontFamily: FONT, padding: "0 0 48px" }}>
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "28px 20px 0" }}>

        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
          <div>
            <div style={{ fontFamily: FONT_DISPLAY, fontSize: 11.5, letterSpacing: "0.1em", color: NARANJA, fontWeight: 600, textTransform: "uppercase" }}>
              El Urqui Básquet · Asociación Civil
            </div>
            <h1 style={{ fontFamily: FONT_DISPLAY, fontSize: 22, fontWeight: 700, margin: "3px 0 0", color: BLANCO }}>
              🏀 7ma Edición — Plan de Torneo
            </h1>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {saveLabel && (
              <div style={{ color: saveColor, fontSize: 11, fontFamily: FONT, fontWeight: 600 }}>{saveLabel}</div>
            )}
            <button onClick={descargarListaCompras} className="cs-btn" style={{
              display: "flex", alignItems: "center", gap: 6, background: `${NARANJA}18`, border: `1px solid ${NARANJA}`,
              borderRadius: 8, color: NARANJA, padding: "8px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: FONT,
            }}>
              🛒 Lista de Compras
            </button>
          </div>
        </div>

        {/* KPIs */}
        <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
          <div style={{ background: GRIS, border: `1px solid ${AZUL}`, borderRadius: 10, padding: "8px 14px", display: "flex", flexDirection: "column", minWidth: 140 }}>
            <span style={{ fontSize: 10.5, color: MUTED, textTransform: "uppercase", letterSpacing: "0.06em", fontFamily: FONT }}>Capital inicial</span>
            <div style={{ display: "flex", alignItems: "center", gap: 2 }}>
              <span style={{ fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700, color: AZUL }}>$</span>
              <input type="text" inputMode="numeric" value={capitalInicial === 0 ? "" : String(capitalInicial)}
                onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setCapitalInicial(v === "" ? 0 : Number(v)); }}
                style={{ background: "transparent", border: "none", color: AZUL, padding: 0, width: 100, fontSize: 15, fontWeight: 700, outline: "none", fontFamily: FONT_MONO }} />
            </div>
          </div>
          {[
            { label: "Ganancia estimada", value: fmt(gananciaTotal), color: gananciaTotal >= 0 ? VERDE : ROJO },
            { label: "Saldo final", value: fmt(saldoFinal), color: saldoFinal >= capitalInicial ? VERDE : ROJO },
          ].map(({ label, value, color }) => (
            <div key={label} style={{ background: GRIS, border: `1px solid ${BORDE}`, borderRadius: 10, padding: "8px 14px", display: "flex", flexDirection: "column", minWidth: 120 }}>
              <span style={{ fontSize: 10.5, color: MUTED, textTransform: "uppercase", letterSpacing: "0.06em", fontFamily: FONT }}>{label}</span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700, color }}>{value}</span>
            </div>
          ))}
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          {[
            { key: "inscripcion", label: "📋 Inscripción" },
            { key: "sorteo", label: "🎟 Sorteo" },
            { key: "gastro", label: "🌭 Gastronomía" },
            { key: "remeras", label: "👕 Remeras" },
            { key: "sponsors", label: "🤝 Sponsors" },
            { key: "gastos", label: "💸 Gastos" },
            { key: "resumen", label: "📊 Resumen" },
          ].map(({ key, label }) => (
            <TabBtn key={key} active={tab === key} onClick={() => setTab(key)}>{label}</TabBtn>
          ))}
        </div>

        {/* ── SORTEO ── */}
        {tab === "sorteo" && (
          <Card title="Talonario de Sorteo" accent>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
              <label style={{ color: CLARO, fontSize: 12, fontFamily: FONT }}>Números totales del talonario:</label>
              <input type="text" inputMode="numeric" value={totalNumeros === 0 ? "" : String(totalNumeros)}
                onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setTotalNumeros(v === "" ? 0 : Number(v)); }}
                style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "5px 10px", width: 80, fontSize: 12.5, fontWeight: 700, outline: "none", fontFamily: FONT_MONO, textAlign: "center" }} />
            </div>
            <p style={{ color: MUTED, fontSize: 12.5, marginTop: 0, marginBottom: 10, fontFamily: FONT }}>
              Tres opciones de compra. Los premios son remeras, pantalones y vouchers de sponsors.
            </p>

            {/* Reparto: cuánto de los N números totales está asignado a cada pack */}
            {(() => {
              const asignado = numerosVendidos;
              const restan = totalNumeros - asignado;
              const pct = totalNumeros > 0 ? Math.min(100, (asignado / totalNumeros) * 100) : 0;
              return (
                <div style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 8, padding: "10px 12px", marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: CLARO, marginBottom: 6, fontFamily: FONT }}>
                    <span>Números repartidos entre los 3 packs</span>
                    <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: restan < 0 ? ROJO : BLANCO }}>{asignado} / {totalNumeros}</span>
                  </div>
                  <div style={{ height: 6, borderRadius: 3, background: GRIS, overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${pct}%`, background: restan < 0 ? ROJO : NARANJA, borderRadius: 3 }} />
                  </div>
                  <div style={{ fontSize: 11, color: restan < 0 ? ROJO : MUTED, marginTop: 6, fontFamily: FONT }}>
                    {restan < 0
                      ? `Te pasaste por ${Math.abs(restan)} números — bajá "packs vendidos" en alguno.`
                      : `Todavía te quedan ${restan} números por asignar entre los packs.`}
                  </div>
                </div>
              );
            })()}

            {[
              { label: "Pack 1", num: pack1Num, setNum: setPack1Num, precio: pack1Precio, setPrecio: setPack1Precio, vendidos: pack1Vendidos, setVendidos: setPack1Vendidos, maxV: 200 },
              { label: "Pack 2", num: pack2Num, setNum: setPack2Num, precio: pack2Precio, setPrecio: setPack2Precio, vendidos: pack2Vendidos, setVendidos: setPack2Vendidos, maxV: 100 },
              { label: "Pack 3", num: pack3Num, setNum: setPack3Num, precio: pack3Precio, setPrecio: setPack3Precio, vendidos: pack3Vendidos, setVendidos: setPack3Vendidos, maxV: 60 },
            ].map(({ label, num, setNum, precio, setPrecio, vendidos, setVendidos, maxV }) => (
              <div key={label} style={{ background: GRIS_CLARO, borderRadius: 7, padding: "14px 16px", marginBottom: 8 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                  <span style={{ color: BLANCO, fontWeight: 700, fontSize: 12.5, fontFamily: FONT }}>{label}</span>
                  <span style={{ color: NARANJA, fontSize: 11, fontFamily: FONT_MONO, fontWeight: 700 }}>
                    {num > 0 ? fmt(precio / num) : "—"} / número
                  </span>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 6 }}>
                  <div>
                    <label style={{ color: MUTED, fontSize: 11.5, display: "block", marginBottom: 3, fontFamily: FONT }}>Números por pack</label>
                    <input type="text" inputMode="numeric" value={num === 0 ? "" : String(num)} onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setNum(v === "" ? 0 : Number(v)); }}
                      style={{ background: GRIS, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "7px 10px", width: "100%", fontSize: 12.5, fontWeight: 700, outline: "none", fontFamily: FONT }} />
                  </div>
                  <div>
                    <label style={{ color: MUTED, fontSize: 11.5, display: "block", marginBottom: 3, fontFamily: FONT }}>Precio del pack ($)</label>
                    <input type="text" inputMode="numeric" value={precio === 0 ? "" : String(precio)} onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setPrecio(v === "" ? 0 : Number(v)); }}
                      style={{ background: GRIS, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "7px 10px", width: "100%", fontSize: 12.5, fontWeight: 700, outline: "none", fontFamily: FONT }} />
                  </div>
                </div>
                <Slider label="Packs vendidos" min={0} max={maxV} step={1} value={vendidos} onChange={setVendidos} prefix="" suffix=" packs" />
                <Row label="Números generados" value={`${vendidos * num}`} />
                <Row label="Recaudado" value={fmt(vendidos * precio)} color={VERDE} />
              </div>
            ))}

            {/* Comparación de rédito por número — para decidir dónde conviene empujar ventas */}
            {(() => {
              const packs = [
                { label: "Pack 1", num: pack1Num, precio: pack1Precio },
                { label: "Pack 2", num: pack2Num, precio: pack2Precio },
                { label: "Pack 3", num: pack3Num, precio: pack3Precio },
              ].filter(p => p.num > 0).map(p => ({ ...p, porNumero: p.precio / p.num }));
              if (packs.length < 2) return null;
              const ordenado = [...packs].sort((a, b) => b.porNumero - a.porNumero);
              const mejor = ordenado[0], peor = ordenado[ordenado.length - 1];
              const diffPct = peor.porNumero > 0 ? Math.round(((mejor.porNumero - peor.porNumero) / peor.porNumero) * 100) : 0;
              return (
                <div style={{ background: `${AZUL}14`, border: `1px solid ${AZUL}44`, borderRadius: 8, padding: 12, marginBottom: 10 }}>
                  <div style={{ color: AZUL, fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 8, fontFamily: FONT_DISPLAY }}>
                    ¿Dónde conviene más empujar ventas?
                  </div>
                  {ordenado.map((p, i) => (
                    <div key={p.label} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: i < ordenado.length - 1 ? 6 : 0 }}>
                      <span style={{ width: 16, height: 16, borderRadius: "50%", background: i === 0 ? VERDE : i === ordenado.length - 1 ? ROJO : MUTED, color: NEGRO, fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{i + 1}</span>
                      <span style={{ color: CLARO, fontSize: 12, fontFamily: FONT, flex: 1 }}>{p.label}</span>
                      <span style={{ color: i === 0 ? VERDE : BLANCO, fontFamily: FONT_MONO, fontSize: 12, fontWeight: 700 }}>{fmt(p.porNumero)}/número</span>
                    </div>
                  ))}
                  {diffPct > 0 && (
                    <div style={{ fontSize: 11, color: MUTED, marginTop: 8, paddingTop: 8, borderTop: `1px solid ${AZUL}33`, lineHeight: 1.4, fontFamily: FONT }}>
                      💡 {mejor.label} rinde <strong style={{ color: VERDE }}>{diffPct}% más por número</strong> que {peor.label}. Con los mismos {totalNumeros} números del talonario, priorizar {mejor.label} (aunque cueste más venderlo de a uno) deja más plata que apostar todo a los packs grandes.
                    </div>
                  )}
                </div>
              );
            })()}

            <div style={{ background: `${VERDE}14`, border: `1px solid ${VERDE}44`, borderRadius: 8, padding: 12 }}>
              <Row label="Números totales vendidos" value={`${numerosVendidos} / ${totalNumeros}`} />
              <Row label="Total recaudado sorteo" value={fmt(recaudadoSorteo)} bold color={VERDE} />
              <div style={{ marginTop: 8, paddingTop: 8, borderTop: `1px solid ${VERDE}33` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ color: CLARO, fontSize: 12, fontFamily: FONT }}>Cantidad de premios del sorteo:</span>
                  <input type="text" inputMode="numeric" value={cantPremios === 0 ? "" : String(cantPremios)} onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setCantPremios(v === "" ? 0 : Number(v)); }}
                    style={{ background: GRIS, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "5px 10px", width: 80, fontSize: 12.5, fontWeight: 700, outline: "none", fontFamily: FONT, textAlign: "center" }} />
                </div>
                <div style={{ color: MUTED, fontSize: 11.5, marginTop: 6, fontFamily: FONT }}>
                  Recaudado por premio: <strong style={{ color: BLANCO }}>{fmt(cantPremios > 0 ? recaudadoSorteo / cantPremios : 0)}</strong>
                </div>
              </div>
            </div>
            <p style={{ color: MUTED, fontSize: 11.5, marginTop: 10, fontFamily: FONT }}>
              💡 Si los sponsors donan los premios (vouchers, remeras), todo lo recaudado es ganancia pura.
            </p>
          </Card>
        )}

        {/* ── INSCRIPCIÓN ── */}
        {tab === "inscripcion" && (
          <Card title="Inscripción al Torneo" accent>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <NumInput label="Equipos inscriptos" value={equipos} onChange={setEquipos} suffix="equipos" />
              <NumInput label="Precio por equipo" value={precioPorEquipo} onChange={setPrecioPorEquipo} />
            </div>

            {/* Kit por equipo */}
            <div style={{ margin: "18px 0 10px", color: BLANCO, fontSize: 12.5, fontWeight: 700, fontFamily: FONT }}>Kit por equipo</div>
            <p style={{ color: MUTED, fontSize: 11.5, margin: "0 0 12px", fontFamily: FONT }}>
              Costo por equipo de cada ítem — se multiplica por la cantidad de equipos.
            </p>
            {kitItems.map((item, i) => (
              <div key={i} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6 }}>
                <input type="text" value={item.desc}
                  onChange={e => { const n = [...kitItems]; n[i] = { ...n[i], desc: e.target.value }; setKitItems(n); }}
                  placeholder="Descripción"
                  style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: BLANCO, padding: "8px 10px", flex: 2, fontSize: 12, outline: "none", fontFamily: FONT }} />
                <div style={{ display: "flex", alignItems: "center", gap: 4, flex: 1 }}>
                  <span style={{ color: MUTED, fontSize: 11.5 }}>$</span>
                  <input type="text" inputMode="numeric"
                    value={item.precio === 0 ? "" : String(item.precio)}
                    onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); const n = [...kitItems]; n[i] = { ...n[i], precio: v === "" ? 0 : Number(v) }; setKitItems(n); }}
                    placeholder="0"
                    style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "8px 8px", width: "100%", fontSize: 12, fontWeight: 700, outline: "none", fontFamily: FONT, textAlign: "right" }} />
                </div>
                {kitItems.length > 1 && (
                  <button onClick={() => setKitItems(kitItems.filter((_, j) => j !== i))}
                    style={{ background: "transparent", border: `1px solid ${BORDE}`, borderRadius: 6, color: ROJO, padding: "8px 10px", cursor: "pointer", fontSize: 13, fontWeight: 700, lineHeight: 1 }}>×</button>
                )}
              </div>
            ))}
            <button onClick={() => setKitItems([...kitItems, { desc: "", precio: 0 }])}
              style={{ background: GRIS_CLARO, border: `1px solid ${NARANJA}`, borderRadius: 6, color: NARANJA, padding: "8px 16px", cursor: "pointer", fontSize: 12.5, fontWeight: 700, fontFamily: FONT, marginBottom: 10 }}>
              + Agregar ítem
            </button>

            <div style={{ background: GRIS_CLARO, borderRadius: 7, padding: 14, marginTop: 4 }}>
              <Row label="Equipos" value={`${equipos} equipos`} />
              <Row label="Precio por equipo (inscripción)" value={fmt(precioPorEquipo)} />
              <div style={{ borderTop: `1px solid ${BORDE}`, margin: "6px 0" }} />
              <div style={{ color: CLARO, fontSize: 11.5, fontWeight: 600, margin: "6px 0 4px", fontFamily: FONT }}>Kit por equipo:</div>
              {kitItems.map((item, i) => (
                <Row key={i} label={item.desc || `Ítem ${i + 1}`} value={`${fmt(item.precio)} × ${equipos} = ${fmt(item.precio * equipos)}`} sub />
              ))}
              <Row label="Subtotal kit por equipo" value={fmt(kitItems.reduce((a, b) => a + (b.precio || 0), 0))} color={CLARO} />
              <Row label={`Costo kit total (× ${equipos} equipos)`} value={`− ${fmt(costoKitTotal)}`} color={ROJO} bold />
              <div style={{ borderTop: `1px solid ${BORDE}`, margin: "6px 0" }} />
              <Row label="Neto inscripción" value={fmt(totalInscripcionConKit)} bold color={VERDE} />
            </div>
            <p style={{ color: MUTED, fontSize: 11.5, marginTop: 10, fontFamily: FONT }}>
              💡 La última edición fue $40.000 por equipo. Ajustalo según lo que definan.
            </p>
          </Card>
        )}

        {/* ── REMERAS ── */}
        {tab === "remeras" && (
          <Card title="Remeras" accent>
            <div style={{ borderLeft: `3px solid ${NARANJA}`, paddingLeft: 14, marginBottom: 16 }}>
              <div style={{ color: BLANCO, fontSize: 13, fontWeight: 700, marginBottom: 6, fontFamily: FONT }}>Remeras 7ma Edición (algodón)</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6, marginTop: 8 }}>
                <span style={{ color: MUTED, fontSize: 12, fontFamily: FONT, whiteSpace: "nowrap" }}>Precio si paga transferencia:</span>
                <span style={{ color: MUTED, fontSize: 11.5 }}>$</span>
                <input type="text" inputMode="numeric" value={precioTransferencia7ma === 0 ? "" : String(precioTransferencia7ma)} onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setPrecioTransferencia7ma(v === "" ? 0 : Number(v)); }}
                  style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "6px 10px", width: 120, fontSize: 12, fontWeight: 700, outline: "none", fontFamily: FONT }} />
                <span style={{ color: MUTED, fontSize: 11.5 }}>/u.</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <span style={{ color: MUTED, fontSize: 12, fontFamily: FONT, whiteSpace: "nowrap" }}>Precio si paga efectivo:</span>
                <span style={{ color: MUTED, fontSize: 11.5 }}>$</span>
                <input type="text" inputMode="numeric" value={precioEfectivo7ma === 0 ? "" : String(precioEfectivo7ma)} onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setPrecioEfectivo7ma(v === "" ? 0 : Number(v)); }}
                  style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "6px 10px", width: 120, fontSize: 12, fontWeight: 700, outline: "none", fontFamily: FONT }} />
                <span style={{ color: MUTED, fontSize: 11.5 }}>/u.</span>
              </div>
              <div style={{ color: CLARO, fontSize: 12, fontWeight: 600, margin: "4px 0 8px", fontFamily: FONT }}>Stock por talle</div>
              <TalleGrid talles={TALLES} values={r7Stock} setters={r7Setters} accentColor={NARANJA} />
              <div style={{ background: GRIS_CLARO, borderRadius: 7, padding: 12, marginTop: 4 }}>
                {TALLES.map((t, i) => r7Stock[i] > 0 && <Row key={t} label={`Talle ${t}`} value={`${r7Stock[i]} u.`} sub />)}
                <Row label="Total a comprar" value={`${total7ma} u.`} bold color={NARANJA} />
                <Row label="Inversión total (compra)" value={fmt(costoTotal7ma)} bold color={ROJO} />
                <Row label="Ganancia si todo transferencia" value={fmt(gananciaRemeras7maTransf)} color={gananciaRemeras7maTransf >= 0 ? VERDE : ROJO} />
                <Row label="Ganancia si todo efectivo" value={fmt(gananciaRemeras7maEfec)} bold color={gananciaRemeras7maEfec >= 0 ? VERDE : ROJO} />
              </div>
            </div>

            <div style={{ borderLeft: `3px solid ${AZUL}`, paddingLeft: 14 }}>
              <div style={{ color: BLANCO, fontSize: 13, fontWeight: 700, marginBottom: 6, fontFamily: FONT }}>Remeras de Juego (stock)</div>
              <p style={{ color: MUTED, fontSize: 12, margin: "0 0 10px", fontFamily: FONT }}>
                La ganancia se calcula sobre el total del stock (suma de talles).
              </p>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                <span style={{ color: MUTED, fontSize: 12, fontFamily: FONT, whiteSpace: "nowrap" }}>Precio si paga transferencia:</span>
                <span style={{ color: MUTED, fontSize: 11.5 }}>$</span>
                <input type="text" inputMode="numeric" value={precioTransferenciaJuego === 0 ? "" : String(precioTransferenciaJuego)} onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setPrecioTransferenciaJuego(v === "" ? 0 : Number(v)); }}
                  style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "6px 10px", width: 120, fontSize: 12, fontWeight: 700, outline: "none", fontFamily: FONT }} />
                <span style={{ color: MUTED, fontSize: 11.5 }}>/u.</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
                <span style={{ color: MUTED, fontSize: 12, fontFamily: FONT, whiteSpace: "nowrap" }}>Precio si paga efectivo:</span>
                <span style={{ color: MUTED, fontSize: 11.5 }}>$</span>
                <input type="text" inputMode="numeric" value={precioEfectivoJuego === 0 ? "" : String(precioEfectivoJuego)} onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setPrecioEfectivoJuego(v === "" ? 0 : Number(v)); }}
                  style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "6px 10px", width: 120, fontSize: 12, fontWeight: 700, outline: "none", fontFamily: FONT }} />
                <span style={{ color: MUTED, fontSize: 11.5 }}>/u.</span>
              </div>
              <div style={{ color: CLARO, fontSize: 12, fontWeight: 600, margin: "4px 0 8px", fontFamily: FONT }}>Stock por talle</div>
              <TalleGrid talles={TALLES} values={rjStock} setters={rjSetters} accentColor={AZUL} />
              <div style={{ background: GRIS_CLARO, borderRadius: 7, padding: 12 }}>
                {TALLES.map((t, i) => rjStock[i] > 0 && <Row key={t} label={`Talle ${t}`} value={`${rjStock[i]} u.`} sub />)}
                <Row label="Total en stock" value={`${totalJuego} u.`} />
                <Row label="Ganancia si todo transferencia" value={fmt(ventaJuegoTransf)} color={VERDE} />
                <Row label="Ganancia si todo efectivo" value={fmt(ventaJuegoEfec)} bold color={VERDE} />
              </div>
            </div>
          </Card>
        )}

        {/* ── GASTRO ── */}
        {tab === "gastro" && (
          <Card title="Gastronomía Propia" accent>
            <p style={{ color: MUTED, fontSize: 12.5, marginTop: 0, marginBottom: 10, fontFamily: FONT }}>
              Club de Maltas, Focacceria Marzano e Istanbul tienen sus stands. El Urqui controla parrilla y bebidas.
            </p>

            {/* PRODUCTOS QUE VENDEMOS */}
            <div style={{ color: BLANCO, fontSize: 13, fontWeight: 700, marginBottom: 8, fontFamily: FONT }}>🛒 Lo que vendemos</div>
            <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr 1fr 1fr", gap: 8, marginBottom: 6 }}>
              <span style={{ color: MUTED, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", fontFamily: FONT }}>Producto</span>
              <span style={{ color: MUTED, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", fontFamily: FONT, textAlign: "center" }}>Precio</span>
              <span style={{ color: MUTED, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", fontFamily: FONT, textAlign: "center" }}>Cant. a vender</span>
              <span style={{ color: MUTED, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", fontFamily: FONT, textAlign: "center" }}>Ganancia</span>
            </div>

            <BebidaRow label="🌭 Choripanes" precio={precioChoripan} setPrecio={setPrecioChoripan} cant={porcionesChoris} setCant={setPorcionesChoris} />
            <BebidaRow label="🍔 Hamburguesas" precio={precioHamburguesa} setPrecio={setPrecioHamburguesa} cant={porcionesHamburguesas} setCant={setPorcionesHamburguesas} />
            <BebidaRow label="🥃 Fernet 500 ml" precio={fernet500Precio} setPrecio={setFernet500Precio} cant={fernet500Cant} setCant={setFernet500Cant} />
            <BebidaRow label="🥃 Fernet 1 l" precio={fernet1LPrecio} setPrecio={setFernet1LPrecio} cant={fernet1LCant} setCant={setFernet1LCant} />
            <BebidaRow label="🍹 Amargo 500 ml" precio={amargo500Precio} setPrecio={setAmargo500Precio} cant={amargo500Cant} setCant={setAmargo500Cant} />
            <BebidaRow label="🍹 Amargo 1 l" precio={amargo1LPrecio} setPrecio={setAmargo1LPrecio} cant={amargo1LCant} setCant={setAmargo1LCant} />
            <BebidaRow label="🥤 Gaseosa 500 ml" precio={gaseosaBeb500Precio} setPrecio={setGaseosaBeb500Precio} cant={gaseosaBeb500Cant} setCant={setGaseosaBeb500Cant} />
            <BebidaRow label="🥤 Gaseosa 1 l" precio={gaseosaBeb1LPrecio} setPrecio={setGaseosaBeb1LPrecio} cant={gaseosaBeb1LCant} setCant={setGaseosaBeb1LCant} />

            {/* INSUMOS QUE NO SE VENDEN */}
            <div style={{ color: BLANCO, fontSize: 13, fontWeight: 700, margin: "18px 0 4px", fontFamily: FONT }}>🧾 Insumos que compramos (no se venden)</div>
            <p style={{ color: MUTED, fontSize: 12, margin: "0 0 10px", fontFamily: FONT }}>
              Todo lo que compramos para armar lo de arriba (fernet, coca, carbón, hielo, etc.) — es lo que se descuenta como costo. Cargá el costo unitario y calculo el total, o cargá el total directo y calculo el costo unitario.
            </p>
            <div style={{ display: "grid", gridTemplateColumns: "1.4fr 0.8fr 0.9fr 1fr auto", gap: 6, marginBottom: 6 }}>
              <span style={{ color: MUTED, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", fontFamily: FONT }}>Descripción</span>
              <span style={{ color: MUTED, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", fontFamily: FONT, textAlign: "center" }}>Cant. a comprar</span>
              <span style={{ color: MUTED, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", fontFamily: FONT, textAlign: "center" }}>Costo</span>
              <span style={{ color: MUTED, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", fontFamily: FONT, textAlign: "center" }}>Total</span>
              <span></span>
            </div>
            {insumoItems.map((item, i) => (
              <InsumoRow key={i} item={item}
                onChange={next => { const n = [...insumoItems]; n[i] = next; setInsumoItems(n); }}
                onDelete={() => setInsumoItems(insumoItems.filter((_, j) => j !== i))} />
            ))}
            <button onClick={() => setInsumoItems([...insumoItems, { desc: "", cantidad: 0, costo: 0, obs: "" }])}
              style={{ background: "none", border: `1px dashed ${BORDE}`, borderRadius: 6, color: CLARO, padding: "6px 12px", fontSize: 12, cursor: "pointer", fontFamily: FONT, marginBottom: 8 }}>
              + Agregar insumo
            </button>

            <div style={{ background: `${VERDE}14`, border: `1px solid ${VERDE}44`, borderRadius: 8, padding: 12, marginTop: 8 }}>
              <Row label="Total venta" value={fmt(ventaChoris + ventaHamburguesas + totalBebidas)} />
              <Row label="Total insumos (costo)" value={fmt(costoInsumosTotal)} color={ROJO} />
              <Row label="Ganancia neta" value={fmt(ventaChoris + ventaHamburguesas + totalBebidas - costoInsumosTotal)} bold color={VERDE} />
            </div>
          </Card>
        )}

        {/* ── SPONSORS ── */}
        {tab === "sponsors" && (
          <Card title="Sponsors del Evento" accent>
            <div style={{ background: GRIS_CLARO, borderRadius: 7, padding: "4px 0", marginBottom: 10 }}>
              {[
                { nombre: "Club de Maltas", detalle: "Stand Propio" },
                { nombre: "Focacceria Marzano", detalle: "Stand Propio" },
                { nombre: "Istanbul", detalle: "Stand Propio" },
              ].map(({ nombre, detalle }) => (
                <div key={nombre} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 16px", borderBottom: `1px solid ${GRIS}` }}>
                  <span style={{ color: BLANCO, fontSize: 13, fontWeight: 600, fontFamily: FONT }}>{nombre}</span>
                  <span style={{ color: MUTED, fontSize: 12, fontFamily: FONT }}>{detalle}</span>
                </div>
              ))}
            </div>
            <Slider label="Aporte en efectivo por sponsor (opcional)" min={0} max={100000} step={5000} value={aporteSponsor} onChange={setAporteSponsor} />
            {aporteSponsor > 0 && (
              <div style={{ background: GRIS_CLARO, borderRadius: 7, padding: 12, marginBottom: 10 }}>
                <Row label="Aporte total sponsors (3 × aporte)" value={fmt(totalSponsors)} bold color={VERDE} />
              </div>
            )}
            <div style={{ background: `${VERDE}14`, border: `1px solid ${VERDE}44`, borderRadius: 10, padding: "12px 14px" }}>
              <div style={{ color: VERDE, fontWeight: 700, fontSize: 13, marginBottom: 8, fontFamily: FONT }}>Propuesta de valor para sponsors 🤝</div>
              {[
                "Logo en las remeras de la 7ma edición (quedan en circulación)",
                "Visibilidad ante +400 personas en Parque Urquiza",
                "Story en Instagram @elurquibasquet",
                "Mención en el banner publicitario del video de la final",
                "Pueden donar premios para el sorteo (remeras, vouchers)",
              ].map((item, i) => (
                <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", padding: "6px 0", borderBottom: i < 4 ? `1px solid ${VERDE}33` : "none" }}>
                  <span style={{ color: NARANJA, fontSize: 14, lineHeight: 1, marginTop: 1 }}>✓</span>
                  <span style={{ color: CLARO, fontSize: 12.5, lineHeight: 1.5, fontFamily: FONT }}>{item}</span>
                </div>
              ))}
            </div>
          </Card>
        )}

        {/* ── GASTOS ── */}
        {tab === "gastos" && (
          <Card title="Gastos varios" accent>
            <p style={{ color: MUTED, fontSize: 12.5, marginTop: 0, marginBottom: 12, fontFamily: FONT }}>
              Cualquier gasto suelto que no entre en las otras pestañas (arreglos, imprevistos, compras de último momento, etc.). Se suman como egreso en el Resumen general.
            </p>
            {manualItems.map((item, i) => (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "2fr 1fr 2fr auto", gap: 6, marginBottom: 6, alignItems: "center" }}>
                <input type="text" placeholder="Descripción" value={item.desc}
                  onChange={e => { const n = [...manualItems]; n[i] = { ...n[i], desc: e.target.value }; setManualItems(n); }}
                  style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: BLANCO, padding: "7px 10px", fontSize: 12.5, outline: "none", fontFamily: FONT }} />
                <input type="text" inputMode="numeric" placeholder="Precio" value={item.precio === 0 ? "" : String(item.precio)}
                  onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); const n = [...manualItems]; n[i] = { ...n[i], precio: v === "" ? 0 : Number(v) }; setManualItems(n); }}
                  style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: NARANJA, padding: "7px 10px", fontSize: 12.5, fontWeight: 700, outline: "none", fontFamily: FONT }} />
                <input type="text" placeholder="Observación (opcional)" value={item.obs || ""}
                  onChange={e => { const n = [...manualItems]; n[i] = { ...n[i], obs: e.target.value }; setManualItems(n); }}
                  style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: MUTED, padding: "7px 10px", fontSize: 12.5, outline: "none", fontFamily: FONT }} />
                <button onClick={() => setManualItems(manualItems.filter((_, j) => j !== i))}
                  style={{ background: "none", border: "none", color: ROJO, cursor: "pointer", padding: 4, display: "flex" }}>
                  <X size={16} />
                </button>
              </div>
            ))}
            <button onClick={() => setManualItems([...manualItems, { desc: "", precio: 0, obs: "" }])}
              style={{ background: "none", border: `1px dashed ${BORDE}`, borderRadius: 6, color: CLARO, padding: "7px 14px", fontSize: 12.5, cursor: "pointer", fontFamily: FONT, marginBottom: 10 }}>
              + Agregar gasto
            </button>
            {manualItems.length === 0 && (
              <div style={{ color: MUTED, fontSize: 12.5, fontFamily: FONT, padding: "10px 0" }}>Todavía no cargaste ningún gasto suelto.</div>
            )}
            {manualItems.length > 0 && (
              <div style={{ background: `${ROJO}14`, border: `1px solid ${ROJO}44`, borderRadius: 8, padding: 12, marginTop: 6 }}>
                <Row label="Subtotal gastos varios" value={fmt(costoManualTotal)} bold color={ROJO} />
              </div>
            )}
          </Card>
        )}

        {/* ── RESUMEN ── */}
        {tab === "resumen" && (
          <>
            <Card title="📥 Ingresos" accent>
              <Row label="Sorteo (talonario)" value={fmt(recaudadoSorteo)} />
              <Row label="Inscripción al torneo" value={fmt(totalInscripcion)} />
              <Row label="Kit por equipo (total)" value={fmt(costoKitTotal)} />
              <Row label="Venta remeras 7ma" value={fmt(ventaRemeras7ma)} />
              <Row label="Venta remeras de juego" value={fmt(gananciaJuego)} />
              <Row label="Venta choripanes" value={fmt(ventaChoris)} />
              <Row label="Venta hamburguesas" value={fmt(ventaHamburguesas)} />
              <Row label="Venta bebidas (Fernet, Amargo, Gaseosa)" value={fmt(totalBebidas)} />
              <Row label="Aporte sponsors" value={fmt(totalSponsors)} />
              <Row label="TOTAL INGRESOS" value={fmt(totalIngresos)} bold color={VERDE} />
            </Card>
            <Card title="📤 Egresos">
              <Row label="Remeras 7ma Algodón" value={fmt(costoTotal7ma)} color={ROJO} />
              <Row label="Kit por equipo" value={fmt(costoKitTotal)} color={ROJO} />
              <Row label="Insumos de gastronomía (fernet, coca, carbón, hielo, etc.)" value={fmt(costoInsumosTotal)} color={ROJO} />
              {manualItems.length > 0 && <Row label="Pestaña GASTOS" value={fmt(costoManualTotal)} color={ROJO} />}
              <Row label="TOTAL EGRESOS" value={fmt(totalEgresos)} bold color={ROJO} />
            </Card>
            <Card title="💰 Balance Final">
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0", borderBottom: `1px solid ${BORDE}`, gap: 10 }}>
                <span style={{ color: BLANCO, fontSize: 12, fontFamily: FONT }}>Capital inicial</span>
                <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                  <span style={{ color: MUTED, fontSize: 11.5 }}>$</span>
                  <input type="text" inputMode="numeric" value={capitalInicial === 0 ? "" : String(capitalInicial)}
                    onChange={e => { const v = e.target.value.replace(/^0+(?=\d)/, ""); setCapitalInicial(v === "" ? 0 : Number(v)); }}
                    style={{ background: GRIS_CLARO, border: `1px solid ${BORDE}`, borderRadius: 6, color: AZUL, padding: "5px 9px", width: 110, fontSize: 12.5, fontWeight: 700, outline: "none", fontFamily: FONT_MONO, textAlign: "right" }} />
                </div>
              </div>
              <Row label="Ganancia del evento" value={fmt(gananciaTotal)} color={gananciaTotal >= 0 ? VERDE : ROJO} />
              <Row label="SALDO FINAL" value={fmt(saldoFinal)} bold color={saldoFinal >= capitalInicial ? VERDE : ROJO} />
            </Card>
            <Card title="⚙️ Checklist del día">
              {checklistItems.map((item, i) => (
                <div key={i}
                  onClick={() => { const n = [...checklistItems]; n[i] = { ...n[i], checked: !n[i].checked }; setChecklistItems(n); }}
                  style={{ display: "flex", gap: 8, padding: "9px 0", borderBottom: `1px solid ${GRIS_CLARO}`, fontSize: 12.5, color: item.checked ? MUTED : CLARO, alignItems: "center", fontFamily: FONT, cursor: "pointer", textDecoration: item.checked ? "line-through" : "none" }}>
                  <span style={{ color: item.checked ? VERDE : NARANJA, fontSize: 14, flexShrink: 0 }}>{item.checked ? "☑" : "☐"}</span>
                  <span style={{ flex: 1 }}>{item.text}</span>
                  <button
                    onClick={e => { e.stopPropagation(); setChecklistItems(checklistItems.filter((_, j) => j !== i)); }}
                    style={{ background: "none", border: "none", color: ROJO, opacity: 0.6, cursor: "pointer", padding: 2, display: "flex", flexShrink: 0 }}>
                    <X size={13} />
                  </button>
                </div>
              ))}
              <NewChecklistInput onAdd={text => setChecklistItems([...checklistItems, { text, checked: false }])} />
            </Card>
          </>
        )}
      </div>
    </div>
  );
}

// ============================================================

// ============================================================
// Shell: navegación entre vistas
// ============================================================

function UrquiApp() {
  const [view, setView] = useState(() => {
    try {
      const saved = window.localStorage; // not used for persistence, just guard
    } catch {}
    return "cronograma";
  });

  const views = [
    { id: "cronograma", label: "Cronograma diario", emoji: "🗓️" },
    { id: "torneo", label: "Plan del Torneo", emoji: "🏀" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#0F1013" }}>
      <div style={{
        position: "sticky", top: 0, zIndex: 50,
        background: "#14161B", borderBottom: "1px solid #2A2D35",
        display: "flex", alignItems: "center", gap: 6,
        padding: "10px 16px", flexWrap: "wrap",
      }}>
        <span style={{
          fontFamily: "'Space Grotesk', 'Inter', sans-serif", fontSize: 12.5, fontWeight: 700,
          color: "#8A8D95", letterSpacing: "0.08em", textTransform: "uppercase", marginRight: 10,
        }}>
          Urqui Básquet · 7ma Edición
        </span>
        <div style={{ display: "flex", gap: 6 }}>
          {views.map(v => (
            <button
              key={v.id}
              onClick={() => setView(v.id)}
              style={{
                display: "flex", alignItems: "center", gap: 6,
                padding: "7px 14px", borderRadius: 8, fontSize: 13, fontWeight: 700,
                fontFamily: "'Inter', sans-serif", cursor: "pointer",
                border: view === v.id ? "1px solid #FF8C42" : "1px solid #2A2D35",
                background: view === v.id ? "#FF8C4222" : "transparent",
                color: view === v.id ? "#FF8C42" : "#8A8D95",
                transition: "opacity 0.15s ease",
              }}
            >
              <span>{v.emoji}</span> {v.label}
            </button>
          ))}
        </div>
      </div>

      <div>
        {view === "cronograma" ? <DailySchedule /> : <TorneoPlanner />}
      </div>
    </div>
  );
}



const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<UrquiApp />);
</script>
</body>
