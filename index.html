const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Puente a Firestore: mismo shape que window.storage.get/set de Claude, para no tocar el resto del código ──
async function dbGet(key) {
  const { doc, getDoc } = window.__fb;
  const snap = await getDoc(doc(window.__fb.db, "urqui", key));
  if (!snap.exists()) throw new Error("not found: " + key);
  return { key, value: snap.data().value };
}
async function dbSet(key, value) {
  const { doc, setDoc } = window.__fb;
  await setDoc(doc(window.__fb.db, "urqui", key), { value, updatedAt: Date.now() });
  return { key, value };
}


const COLOR_PALETTE = ["#FF8C42", "#5B9DFF", "#9B8CFF", "#35D0BA", "#FF6FA5", "#B4E24A", "#FFD166", "#4CC9F0", "#F94144", "#90BE6D"];
const TOURNEY_DATE = new Date(2026, 10, 7); // Sábado 7 de noviembre 2026 — 7ma Edición

const DEFAULT_CATEGORIES = [
  { id: "bloque-1", label: "Bloque 1" },
  { id: "bloque-2", label: "Bloque 2" },
  { id: "bloque-3", label: "Bloque 3" },
  { id: "sorteo", label: "Sorteo" },
  { id: "semis", label: "Semis" },
  { id: "final", label: "Final" },
  { id: "logistica", label: "Logística" },
].map((c, i) => ({ ...c, color: COLOR_PALETTE[i % COLOR_PALETTE.length] }));

function slugify(s) {
  return s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || `cat-${Date.now()}`;
}

const PIXELS_PER_HOUR = 60;
const DAY_MINUTES = 24 * 60;

function pad(n) { return String(n).padStart(2, "0"); }
function toDateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function minutesFromTime(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function fmtDuration(mins) {
  if (mins <= 0) return "0m";
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h && m) return `${h}h ${m}m`;
  if (h) return `${h}h`;
  return `${m}m`;
}
function fmtDayLabel(d) {
  const s = d.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function isSameDay(a, b) { return toDateKey(a) === toDateKey(b); }

function mergeIntervals(events) {
  const sorted = [...events].map(e => [minutesFromTime(e.start), minutesFromTime(e.end)]).sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const [s, e] of sorted) {
    if (!merged.length || s > merged[merged.length - 1][1]) merged.push([s, e]);
    else merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], e);
  }
  return merged;
}

// Assign horizontal columns to overlapping events (simple sweep).
function layoutColumns(events) {
  const sorted = [...events].sort((a, b) => minutesFromTime(a.start) - minutesFromTime(b.start));
  const clusters = [];
  let current = [];
  let currentEnd = -1;
  for (const ev of sorted) {
    const s = minutesFromTime(ev.start), e = minutesFromTime(ev.end);
    if (current.length && s >= currentEnd) {
      clusters.push(current);
      current = [];
      currentEnd = -1;
    }
    current.push(ev);
    currentEnd = Math.max(currentEnd, e);
  }
  if (current.length) clusters.push(current);

  const positioned = [];
  for (const cluster of clusters) {
    const columns = [];
    for (const ev of cluster) {
      const s = minutesFromTime(ev.start);
      let colIdx = columns.findIndex(colEnd => colEnd <= s);
      if (colIdx === -1) { colIdx = columns.length; columns.push(0); }
      columns[colIdx] = minutesFromTime(ev.end);
      positioned.push({ ev, col: colIdx });
    }
    const totalCols = columns.length;
    for (const p of positioned.slice(-cluster.length)) p.totalCols = totalCols;
  }
  return positioned;
}

// ── Sol y clima — Rosario (Parque Urquiza) ──
// Cálculo astronómico real (ecuación del orto/ocaso), no una tabla fija:
// funciona para cualquier fecha del año. La temperatura es una estimación
// climatológica histórica mensual (no un pronóstico en vivo).
const ROSARIO_LAT = -32.94682;
const ROSARIO_LON = -60.63932;
const ROSARIO_TZ_OFFSET = -3; // UTC-3, Argentina no tiene horario de verano

function torad(d) { return (d * Math.PI) / 180; }
function todeg(r) { return (r * 180) / Math.PI; }

// Temperaturas medias históricas (máx/mín °C) por mes en Rosario.
const MONTH_CLIMATOLOGY = [
  { max: 32, min: 19 }, // Ene
  { max: 30, min: 18 }, // Feb
  { max: 28, min: 16 }, // Mar
  { max: 24, min: 13 }, // Abr
  { max: 20, min: 10 }, // May
  { max: 17, min: 7 },  // Jun
  { max: 16, min: 6 },  // Jul
  { max: 18, min: 7 },  // Ago
  { max: 21, min: 10 }, // Sep
  { max: 24, min: 13 }, // Oct
  { max: 26, min: 15 }, // Nov
  { max: 29, min: 18 }, // Dic
];

function getSunData(date) {
  const year = date.getFullYear(), month = date.getMonth() + 1, day = date.getDate();
  const dateUTCmidnight = new Date(Date.UTC(year, month - 1, day));
  const julianDay = dateUTCmidnight.getTime() / 86400000 + 2440587.5;
  const Jdate = Math.floor(julianDay) + 0.5 - ROSARIO_LON / 360;
  const n = Math.round(Jdate - 2451545.0 + 0.0009);
  const Jstar = 2451545.0 + 0.0009 + n - ROSARIO_LON / 360;

  const M_deg = (357.5291 + 0.98560028 * (Jstar - 2451545.0)) % 360;
  const M = torad(M_deg);
  const C = 1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M);
  const lambda_deg = (M_deg + C + 180 + 102.9372) % 360;
  const lambda = torad(lambda_deg);

  const Jtransit = Jstar + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * lambda);
  const sinDelta = Math.sin(lambda) * Math.sin(torad(23.4397));
  const delta = Math.asin(sinDelta);

  const latRad = torad(ROSARIO_LAT);
  const cosOmega0 = (Math.sin(torad(-0.833)) - Math.sin(latRad) * sinDelta) / (Math.cos(latRad) * Math.cos(delta));
  const omega0 = todeg(Math.acos(Math.max(-1, Math.min(1, cosOmega0))));

  const Jrise = Jtransit - omega0 / 360;
  const Jset = Jtransit + omega0 / 360;

  function julianToHours(J) {
    const ms = (J - 2440587.5) * 86400000;
    const d = new Date(ms + ROSARIO_TZ_OFFSET * 3600000);
    return d.getUTCHours() + d.getUTCMinutes() / 60 + d.getUTCSeconds() / 3600;
  }

  return {
    sunriseH: julianToHours(Jrise),
    sunsetH: julianToHours(Jset),
    solarNoonH: julianToHours(Jtransit),
    declinationDeg: todeg(delta),
  };
}

function solarElevationAt(sunData, hourDecimal) {
  const H = 15 * (hourDecimal - sunData.solarNoonH);
  const delta = torad(sunData.declinationDeg);
  const latRad = torad(ROSARIO_LAT);
  const sinAlt = Math.sin(latRad) * Math.sin(delta) + Math.cos(latRad) * Math.cos(delta) * Math.cos(torad(H));
  return todeg(Math.asin(Math.max(-1, Math.min(1, sinAlt))));
}

function classifyLight(elevation, isBeforeNoon) {
  if (elevation < -6) return { label: "Noche", emoji: "🌙", tip: "Sin luz natural — vas a necesitar iluminación artificial." };
  if (elevation < 0) return { label: isBeforeNoon ? "Antes del amanecer" : "Anocheciendo", emoji: "🌆", tip: "Luz muy baja, casi de noche. Conviene reforzar con luz artificial." };
  if (elevation < 8) return { label: isBeforeNoon ? "Amanecer" : "Atardecer", emoji: isBeforeNoon ? "🌅" : "🌇", tip: "Luz rasante y dorada — linda para fotos, pero se pierde rápido." };
  if (elevation < 30) return { label: isBeforeNoon ? "Sol de mañana" : "Sol de tarde", emoji: "🌤️", tip: "Buena luz, todavía suave. Ideal para jugar sin encandilar." };
  return { label: "Sol alto", emoji: "☀️", tip: "Sol en el punto más fuerte del día — buscar sombra y reforzar hidratación." };
}

function estimateTemp(date, sunData, hourDecimal) {
  const { max, min } = MONTH_CLIMATOLOGY[date.getMonth()];
  const sunrise = sunData.sunriseH;
  const peak = sunData.solarNoonH + 2.3; // el pico térmico llega ~2-3h después del mediodía solar
  let t;
  if (hourDecimal <= sunrise) {
    t = min + (max - min) * 0.12; // madrugada, cerca del mínimo
  } else if (hourDecimal <= peak) {
    t = min + (max - min) * Math.sin((Math.PI / 2) * ((hourDecimal - sunrise) / (peak - sunrise)));
  } else {
    const tau = 4; // horas: qué tan rápido se enfría después del pico
    t = min + (max - min) * Math.exp(-(hourDecimal - peak) / tau);
  }
  return Math.round(t);
}

function hToClock(h) {
  let totalMin = Math.round((((h % 24) + 24) % 24) * 60);
  totalMin = ((totalMin % 1440) + 1440) % 1440;
  const hh = Math.floor(totalMin / 60);
  const mm = totalMin % 60;
  return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
}
function timeStrToDecimal(t) {
  const [h, m] = t.split(":").map(Number);
  return h + m / 60;
}

// Genera puntos de la curva del arco solar (visual, basada en elevación real)
function buildArcPath(sunData, width, height) {
  const points = [];
  const margin = 6;
  for (let i = 0; i <= 48; i++) {
    const h = (i / 48) * 24;
    const elev = solarElevationAt(sunData, h);
    const norm = Math.max(-25, Math.min(80, elev)) / 80; // clamp visual range
    const x = (h / 24) * width;
    const y = height / 2 - norm * (height / 2 - margin);
    points.push([x, y]);
  }
  let d = `M ${points[0][0]},${points[0][1]}`;
  for (let i = 1; i < points.length; i++) {
    const [x0, y0] = points[i - 1];
    const [x1, y1] = points[i];
    const mx = (x0 + x1) / 2;
    d += ` Q ${x0},${y0} ${mx},${(y0 + y1) / 2}`;
  }
  d += ` T ${points[points.length - 1][0]},${points[points.length - 1][1]}`;
  return d;
}

function timeToXY(sunData, hourDecimal, width, height) {
  const elev = solarElevationAt(sunData, hourDecimal);
  const norm = Math.max(-25, Math.min(80, elev)) / 80;
  const x = (hourDecimal / 24) * width;
  const margin = 6;
  const y = height / 2 - norm * (height / 2 - margin);
  return [x, y];
}

function SunWidget({ date, startTime, endTime }) {
  const sunData = useMemo(() => getSunData(date), [date.getFullYear(), date.getMonth(), date.getDate()]);
  const startH = timeStrToDecimal(startTime);
  const endH = timeStrToDecimal(endTime);
  const midH = (startH + endH) / 2;

  const elevStart = solarElevationAt(sunData, startH);
  const phase = classifyLight(elevStart, startH < sunData.solarNoonH);
  const tempStart = estimateTemp(date, sunData, startH);
  const tempEnd = estimateTemp(date, sunData, endH);

  const W = 280, H = 62;
  const arcPath = useMemo(() => buildArcPath(sunData, W, H), [sunData]);
  const [sx, sy] = timeToXY(sunData, Math.max(0, Math.min(24, startH)), W, H);
  const [ex, ey] = timeToXY(sunData, Math.max(0, Math.min(24, endH)), W, H);
  const [mx] = timeToXY(sunData, Math.max(0, Math.min(24, midH)), W, H);

  return (
    <div style={{
      background: "#1D2027", border: "1px solid #2A2D35", borderRadius: 12,
      padding: "12px 14px", display: "flex", flexDirection: "column", gap: 5, marginBottom: 16, width: "100%", boxSizing: "border-box",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
          <span style={{ fontSize: 13 }}>{phase.emoji}</span>
          <span style={{ fontSize: 10, color: "#8A8D95", textTransform: "uppercase", letterSpacing: "0.06em" }}>{phase.label}</span>
        </div>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, fontWeight: 700, color: "#FF8C42" }}>
          ≈ {tempStart}°C{tempEnd !== tempStart ? ` → ${tempEnd}°C` : ""}
        </span>
      </div>

      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: "block" }}>
        <line x1={0} y1={H / 2} x2={W} y2={H / 2} stroke="#2A2D35" strokeWidth="1" />
        <path d={arcPath} fill="none" stroke="#3A3D45" strokeWidth="2" />
        <line x1={sx} y1={0} x2={sx} y2={H} stroke="#FF8C4255" strokeWidth="1" strokeDasharray="2,2" />
        <line x1={ex} y1={0} x2={ex} y2={H} stroke="#FF8C4255" strokeWidth="1" strokeDasharray="2,2" />
        <circle cx={mx} cy={timeToXY(sunData, midH, W, H)[1]} r="4" fill="#FF8C42" stroke="#14161B" strokeWidth="1.5" />
      </svg>

      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#8A8D95" }}>
        <span>🌅 {hToClock(sunData.sunriseH)}</span>
        <span style={{ color: "#B7BAC2" }}>{startTime}–{endTime}</span>
        <span>🌇 {hToClock(sunData.sunsetH)}</span>
      </div>
      <div style={{ fontSize: 10, color: "#6B6E76", lineHeight: 1.35 }}>{phase.tip}</div>
      <div style={{ fontSize: 9.5, color: "#5B5E68", lineHeight: 1.35, fontStyle: "italic" }}>
        Esta es la temperatura estimada para el día que se indica arriba, es decir {date.getDate()}/{date.getMonth() + 1}.
      </div>
    </div>
  );
}

function DailySchedule() {
  const [date, setDate] = useState(TOURNEY_DATE);
  const [events, setEvents] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [catsLoaded, setCatsLoaded] = useState(false);
  const [newCatLabel, setNewCatLabel] = useState("");
  const [showAddCat, setShowAddCat] = useState(false);
  const [editingCatId, setEditingCatId] = useState(null);
  const [editCatLabel, setEditCatLabel] = useState("");
  const [editCatColor, setEditCatColor] = useState("#FF8C42");
  const [name, setName] = useState("");
  const [start, setStart] = useState("09:00");
  const [end, setEnd] = useState("10:00");
  const [category, setCategory] = useState(DEFAULT_CATEGORIES[0].id);
  const [editingId, setEditingId] = useState(null);
  const [now, setNow] = useState(new Date());
  const scrollRef = useRef(null);
  const dateKey = toDateKey(date);
  const today = isSameDay(date, now);
  const nameInputRef = useRef(null);

  // Load categories once (shared across all days)
  useEffect(() => {
    (async () => {
      try {
        const res = await dbGet("schedule-categories");
        let list = res ? JSON.parse(res.value) : DEFAULT_CATEGORIES;
        // Migration: make sure "Logística" exists even for lists saved before it was added
        if (!list.some(c => c.id === "logistica")) {
          list = [...list, { id: "logistica", label: "Logística", color: COLOR_PALETTE[list.length % COLOR_PALETTE.length] }];
        }
        setCategories(list);
        if (list.length) setCategory(list[0].id);
      } catch {
        setCategories(DEFAULT_CATEGORIES);
      } finally {
        setCatsLoaded(true);
      }
    })();
  }, []);

  // Persist categories on change
  useEffect(() => {
    if (!catsLoaded) return;
    (async () => {
      try { await dbSet("schedule-categories", JSON.stringify(categories)); }
      catch { /* ignore */ }
    })();
  }, [categories, catsLoaded]);

  function addCategory() {
    const label = newCatLabel.trim();
    if (!label) return;
    const id = slugify(label);
    if (categories.some(c => c.id === id)) { setCategory(id); setNewCatLabel(""); setShowAddCat(false); return; }
    const color = COLOR_PALETTE[categories.length % COLOR_PALETTE.length];
    setCategories(prev => [...prev, { id, label, color }]);
    setCategory(id);
    setNewCatLabel("");
    setShowAddCat(false);
  }

  function updateCategory(id, patch) {
    setCategories(prev => prev.map(c => c.id === id ? { ...c, ...patch } : c));
  }

  function removeCategory(id) {
    setCategories(prev => {
      if (prev.length <= 1) return prev;
      const next = prev.filter(c => c.id !== id);
      if (category === id) setCategory(next[0]?.id || "");
      return next;
    });
  }

  // Load events for the selected day
  useEffect(() => {
    let cancelled = false;
    setLoaded(false);
    (async () => {
      try {
        const res = await dbGet(`schedule:${dateKey}`);
        if (!cancelled) setEvents(res ? JSON.parse(res.value) : []);
      } catch {
        if (!cancelled) setEvents([]);
      } finally {
        if (!cancelled) setLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, [dateKey]);

  // Persist on change
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try { await dbSet(`schedule:${dateKey}`, JSON.stringify(events)); }
      catch { /* ignore */ }
    })();
  }, [events, loaded, dateKey]);

  // Live clock
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(id);
  }, []);

  // Auto-scroll to current time (or 8am) on day change
  useEffect(() => {
    if (!scrollRef.current) return;
    const target = today ? now.getHours() * 60 + now.getMinutes() : 8 * 60;
    const top = (target / 60) * PIXELS_PER_HOUR - 120;
    scrollRef.current.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [dateKey, loaded]);

  const busyMinutes = useMemo(() => mergeIntervals(events).reduce((a, [s, e]) => a + (e - s), 0), [events]);
  const freeMinutes = DAY_MINUTES - busyMinutes;
  const positioned = useMemo(() => layoutColumns(events), [events]);
  const nextStartByCol = useMemo(() => {
    const byCol = {};
    positioned.forEach(p => { (byCol[p.col] = byCol[p.col] || []).push(p); });
    Object.values(byCol).forEach(list => list.sort((a, b) => minutesFromTime(a.ev.start) - minutesFromTime(b.ev.start)));
    const map = {};
    Object.values(byCol).forEach(list => {
      list.forEach((p, i) => { map[p.ev.id] = list[i + 1] ? minutesFromTime(list[i + 1].ev.start) : null; });
    });
    return map;
  }, [positioned]);

  const overlapWarning = useMemo(() => {
    if (start >= end) return null;
    const s = minutesFromTime(start), e = minutesFromTime(end);
    const clash = events.some(ev => {
      if (ev.id === editingId) return false;
      const es = minutesFromTime(ev.start), ee = minutesFromTime(ev.end);
      return s < ee && e > es;
    });
    return clash ? "Se superpone con otra actividad ya cargada." : null;
  }, [events, start, end, editingId]);

  function resetForm() {
    setName(""); setStart("09:00"); setEnd("10:00"); setCategory(categories[0]?.id || ""); setEditingId(null);
  }

  function handleSubmit(e) {
    e?.preventDefault?.();
    if (!name.trim() || start >= end) return;
    if (editingId) {
      setEvents(prev => prev.map(ev => ev.id === editingId ? { ...ev, name: name.trim(), start, end, category } : ev));
    } else {
      setEvents(prev => [...prev, { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, name: name.trim(), start, end, category }]);
    }
    resetForm();
  }

  function startEdit(ev) {
    setEditingId(ev.id); setName(ev.name); setStart(ev.start); setEnd(ev.end); setCategory(ev.category);
    nameInputRef.current?.focus();
  }

  function deleteEvent(id) {
    setEvents(prev => prev.filter(ev => ev.id !== id));
    if (editingId === id) resetForm();
  }

  function shiftDay(delta) {
    setDate(d => { const nd = new Date(d); nd.setDate(nd.getDate() + delta); return nd; });
  }

  const catColor = (id) => categories.find(c => c.id === id)?.color || "#8A8D95";
  const catLabel = (id) => categories.find(c => c.id === id)?.label || id;
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  return (
    <>
    <div className="cs-app-shell" style={{
      fontFamily: "'Inter', system-ui, sans-serif",
      background: "#14161B",
      color: "#F2F1ED",
      minHeight: "100vh",
      padding: "0",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
        * { box-sizing: border-box; }
        input, select { font-family: 'Inter', sans-serif; }
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
        .cs-scroll::-webkit-scrollbar { width: 8px; }
        .cs-scroll::-webkit-scrollbar-track { background: transparent; }
        .cs-scroll::-webkit-scrollbar-thumb { background: #2A2D35; border-radius: 4px; }
        .cs-block { transition: transform 0.12s ease, box-shadow 0.12s ease; cursor: pointer; }
        .cs-block:hover { transform: translateX(2px); }
        .cs-btn { transition: opacity 0.15s ease, transform 0.1s ease; }
        .cs-btn:hover { opacity: 0.85; }
        .cs-btn:active { transform: scale(0.97); }
        @media (max-width: 820px) {
          .cs-layout { flex-direction: column !important; }
          .cs-sidebar { width: 100% !important; }
        }
        .cs-print-only { display: none; }
        @media print {
          .cs-app-shell { display: none !important; }
          .cs-print-only { display: block !important; }
        }
      `}</style>

      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "28px 20px 60px" }}>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
          <div>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 13, letterSpacing: "0.12em", color: "#FF8C42", fontWeight: 600, textTransform: "uppercase" }}>Cronograma diario</div>
            <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 700, margin: "4px 0 0" }}>{fmtDayLabel(date)}</h1>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button className="cs-btn" onClick={() => shiftDay(-1)} style={navBtnStyle} aria-label="Día anterior"><ChevronLeft size={18} /></button>
            <button className="cs-btn" onClick={() => setDate(TOURNEY_DATE)} style={{ ...navBtnStyle, width: "auto", padding: "0 14px", fontSize: 13, fontWeight: 600, opacity: isSameDay(date, TOURNEY_DATE) ? 0.5 : 1, borderColor: "#FF8C42", color: "#FF8C42" }}>
              🏀 Torneo
            </button>
            <button className="cs-btn" onClick={() => setDate(new Date())} style={{ ...navBtnStyle, width: "auto", padding: "0 14px", fontSize: 13, fontWeight: 600, opacity: today ? 0.5 : 1 }}>
              <CalendarDays size={15} style={{ marginRight: 6 }} /> Hoy
            </button>
            <button className="cs-btn" onClick={() => shiftDay(1)} style={navBtnStyle} aria-label="Día siguiente"><ChevronRight size={18} /></button>
          </div>
        </div>

        {/* Stats bar */}
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 22, flexWrap: "wrap" }}>
          <StatChip label="Actividades" value={events.length} />
          <StatChip label="Ocupado" value={fmtDuration(busyMinutes)} accent="#FF8C42" />
          <StatChip label="Libre" value={fmtDuration(freeMinutes)} accent="#35D0BA" />
          {today && <StatChip label="Hora actual" value={now.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })} accent="#FF4757" />}
          <button className="cs-btn" onClick={() => window.print()} style={{ ...navBtnStyle, width: "auto", padding: "0 14px", fontSize: 13, fontWeight: 600, marginLeft: "auto" }}>
            <Download size={14} style={{ marginRight: 6 }} /> Exportar Cronograma
          </button>
        </div>

        <div className="cs-layout" style={{ display: "flex", gap: 24, alignItems: "flex-start" }}>
          {/* Sidebar: form + list */}
          <div className="cs-sidebar" style={{ width: 340, flexShrink: 0 }}>
            <div style={{ background: "#1D2027", border: "1px solid #2A2D35", borderRadius: 14, padding: 18, marginBottom: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 12, color: editingId ? "#FF8C42" : "#F2F1ED", display: "flex", alignItems: "center", gap: 6 }}>
                {editingId ? <><Pencil size={13} /> Editando actividad</> : <><Plus size={13} /> Nueva actividad</>}
              </div>
              <input
                ref={nameInputRef}
                value={name}
                onChange={e => setName(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter" && name.trim() && start < end) { e.preventDefault(); handleSubmit(); } }}
                placeholder="Ej: Reunión con Tomás"
                style={inputStyle}
              />
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <div style={{ flex: 1 }}>
                  <label style={labelStyle}>Desde</label>
                  <input type="time" value={start} onChange={e => setStart(e.target.value)} style={inputStyle} />
                </div>
                <div style={{ flex: 1 }}>
                  <label style={labelStyle}>Hasta</label>
                  <input type="time" value={end} onChange={e => setEnd(e.target.value)} style={inputStyle} />
                </div>
              </div>

              <label style={{ ...labelStyle, marginTop: 10, display: "block" }}>Categoría</label>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 6 }}>
                {categories.map(c => editingCatId === c.id ? (
                  <span key={c.id} style={{
                    display: "flex", alignItems: "center", gap: 6,
                    padding: "5px 8px", borderRadius: 999, border: `1px solid ${editCatColor}`,
                    background: `${editCatColor}18`,
                  }}>
                    <input
                      type="color"
                      value={editCatColor}
                      onChange={e => setEditCatColor(e.target.value)}
                      title="Elegir color"
                      style={{ width: 20, height: 20, padding: 0, border: "none", background: "none", cursor: "pointer", borderRadius: 4, flexShrink: 0 }}
                    />
                    <input
                      autoFocus
                      value={editCatLabel}
                      onChange={e => setEditCatLabel(e.target.value)}
                      onKeyDown={e => {
                        if (e.key === "Enter") { e.preventDefault(); if (editCatLabel.trim()) { updateCategory(c.id, { label: editCatLabel.trim(), color: editCatColor }); } setEditingCatId(null); }
                        if (e.key === "Escape") setEditingCatId(null);
                      }}
                      style={{ ...inputStyle, width: 100, padding: "4px 6px", fontSize: 12, background: "#14161B" }}
                    />
                    <button
                      type="button"
                      onClick={() => { if (editCatLabel.trim()) { updateCategory(c.id, { label: editCatLabel.trim(), color: editCatColor }); } setEditingCatId(null); }}
                      style={{ background: editCatColor, border: "none", borderRadius: 6, width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}
                    >
                      <Check size={12} color="#14161B" />
                    </button>
                  </span>
                ) : (
                  <span
                    key={c.id}
                    className="cs-btn"
                    style={{
                      display: "flex", alignItems: "center", gap: 6,
                      padding: "6px 8px 6px 10px", borderRadius: 999, fontSize: 12, fontWeight: 500,
                      border: `1px solid ${category === c.id ? c.color : "#2A2D35"}`,
                      background: category === c.id ? `${c.color}22` : "transparent",
                      color: category === c.id ? c.color : "#8A8D95",
                      cursor: "pointer",
                    }}
                  >
                    <button
                      type="button"
                      onClick={() => setCategory(c.id)}
                      style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: "inherit", cursor: "pointer", padding: 0, font: "inherit" }}
                    >
                      <span style={{ width: 7, height: 7, borderRadius: "50%", background: c.color, display: "inline-block" }} />
                      {c.label}
                    </button>
                    <button
                      type="button"
                      onClick={() => { setEditingCatId(c.id); setEditCatLabel(c.label); setEditCatColor(c.color); }}
                      title="Editar nombre y color"
                      style={{ background: "none", border: "none", color: "inherit", opacity: 0.5, cursor: "pointer", padding: 0, display: "flex" }}
                    >
                      <Pencil size={10} />
                    </button>
                    {categories.length > 1 && (
                      <button
                        type="button"
                        onClick={() => removeCategory(c.id)}
                        title="Eliminar categoría"
                        style={{ background: "none", border: "none", color: "inherit", opacity: 0.5, cursor: "pointer", padding: 0, display: "flex" }}
                      >
                        <X size={11} />
                      </button>
                    )}
                  </span>
                ))}

                {!showAddCat ? (
                  <button
                    type="button"
                    onClick={() => setShowAddCat(true)}
                    className="cs-btn"
                    style={{
                      display: "flex", alignItems: "center", gap: 4,
                      padding: "6px 10px", borderRadius: 999, fontSize: 12, fontWeight: 500,
                      border: "1px dashed #3A3D45", background: "transparent", color: "#8A8D95", cursor: "pointer",
                    }}
                  >
                    <Plus size={11} /> Categoría
                  </button>
                ) : (
                  <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <input
                      autoFocus
                      value={newCatLabel}
                      onChange={e => setNewCatLabel(e.target.value)}
                      onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addCategory(); } if (e.key === "Escape") { setShowAddCat(false); setNewCatLabel(""); } }}
                      placeholder="Ej: Bloque 4"
                      style={{ ...inputStyle, width: 110, padding: "5px 8px", fontSize: 12 }}
                    />
                    <button type="button" onClick={addCategory} className="cs-btn" style={{ background: "#FF8C42", border: "none", borderRadius: 6, width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
                      <Check size={13} color="#14161B" />
                    </button>
                  </span>
                )}
              </div>

              {start >= end && <div style={warnStyle}>La hora de fin debe ser posterior al inicio.</div>}
              {overlapWarning && start < end && <div style={warnStyle}>{overlapWarning}</div>}

              <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                <button type="button" onClick={handleSubmit} disabled={!name.trim() || start >= end} className="cs-btn" style={{
                  ...primaryBtnStyle, opacity: (!name.trim() || start >= end) ? 0.4 : 1,
                  cursor: (!name.trim() || start >= end) ? "not-allowed" : "pointer",
                }}>
                  <Check size={14} /> {editingId ? "Guardar cambios" : "Agregar"}
                </button>
                {editingId && (
                  <button type="button" onClick={resetForm} className="cs-btn" style={secondaryBtnStyle}><X size={14} /></button>
                )}
              </div>
            </div>

            <SunWidget date={date} startTime={start} endTime={end} />

            {/* List */}
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {[...events].sort((a, b) => minutesFromTime(a.start) - minutesFromTime(b.start)).map(ev => (
                <div key={ev.id} style={{
                  display: "flex", alignItems: "center", gap: 10,
                  background: "#1D2027", border: "1px solid #2A2D35", borderRadius: 10, padding: "9px 12px",
                }}>
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: catColor(ev.category), flexShrink: 0 }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{ev.name}</div>
                    <div style={{ fontSize: 11, color: "#8A8D95", fontFamily: "'JetBrains Mono', monospace" }}>{ev.start}–{ev.end} · {fmtDuration(minutesFromTime(ev.end) - minutesFromTime(ev.start))}</div>
                  </div>
                  <button className="cs-btn" onClick={() => startEdit(ev)} style={iconBtnStyle} aria-label="Editar"><Pencil size={13} /></button>
                  <button className="cs-btn" onClick={() => deleteEvent(ev.id)} style={{ ...iconBtnStyle, color: "#FF6B6B" }} aria-label="Eliminar"><Trash2 size={13} /></button>
                </div>
              ))}
              {loaded && events.length === 0 && (
                <div style={{ textAlign: "center", padding: "20px 10px", color: "#8A8D95", fontSize: 13, border: "1px dashed #2A2D35", borderRadius: 10 }}>
                  Sin actividades cargadas para este día.
                </div>
              )}
            </div>
          </div>

          {/* Timeline */}
          <div style={{ flex: 1, minWidth: 0, background: "#1D2027", border: "1px solid #2A2D35", borderRadius: 14, overflow: "hidden" }}>
            <div className="cs-scroll" ref={scrollRef} style={{ height: 600, overflowY: "auto", position: "relative" }}>
              <div style={{ position: "relative", height: 24 * PIXELS_PER_HOUR, display: "flex" }}>
                {/* Hour ruler */}
                <div style={{ width: 56, flexShrink: 0, position: "relative", borderRight: "1px solid #2A2D35" }}>
                  {Array.from({ length: 24 }).map((_, h) => (
                    <div key={h} style={{
                      position: "absolute", top: h * PIXELS_PER_HOUR - 7, right: 8,
                      fontFamily: "'JetBrains Mono', monospace", fontSize: 11, fontWeight: 700, color: "#5B5E68",
                    }}>{pad(h)}</div>
                  ))}
                </div>

                {/* Grid + events */}
                <div style={{ flex: 1, position: "relative" }}>
                  {Array.from({ length: 24 }).map((_, h) => (
                    <div key={h} style={{
                      position: "absolute", top: h * PIXELS_PER_HOUR, left: 0, right: 0,
                      borderTop: h === 0 ? "none" : "1px solid #24262D",
                    }} />
                  ))}
                  {Array.from({ length: 48 }).map((_, half) => half % 2 === 1 && (
                    <div key={half} style={{
                      position: "absolute", top: half * (PIXELS_PER_HOUR / 2), left: 0, right: 0,
                      borderTop: "1px dashed #1E2027",
                    }} />
                  ))}

                  {today && (
                    <div style={{
                      position: "absolute", top: (nowMinutes / 60) * PIXELS_PER_HOUR, left: 0, right: 0,
                      display: "flex", alignItems: "center", zIndex: 5, pointerEvents: "none",
                    }}>
                      <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#FF4757", marginLeft: -4, boxShadow: "0 0 0 4px #FF475733" }} />
                      <div style={{ flex: 1, height: 1.5, background: "#FF4757" }} />
                    </div>
                  )}

                  {positioned.map(({ ev, col, totalCols }) => {
                    const top = (minutesFromTime(ev.start) / 60) * PIXELS_PER_HOUR;
                    const naturalHeight = ((minutesFromTime(ev.end) - minutesFromTime(ev.start)) / 60) * PIXELS_PER_HOUR;
                    const nextStartMin = nextStartByCol[ev.id];
                    const desiredHeight = Math.max(20, naturalHeight);
                    const height = Math.max(6, nextStartMin != null
                      ? Math.min(desiredHeight, ((nextStartMin - minutesFromTime(ev.start)) / 60) * PIXELS_PER_HOUR - 2)
                      : desiredHeight);
                    const widthPct = 100 / totalCols;
                    const color = catColor(ev.category);
                    return (
                      <div
                        key={ev.id}
                        className="cs-block"
                        onClick={() => startEdit(ev)}
                        style={{
                          position: "absolute",
                          top: top + 1, height: height - 2,
                          left: `calc(${col * widthPct}% + 4px)`,
                          width: `calc(${widthPct}% - 8px)`,
                          background: `${color}1F`,
                          borderLeft: `3px solid ${color}`,
                          borderRadius: 6,
                          padding: "5px 8px",
                          overflow: "hidden",
                        }}
                        title={`${ev.name} · ${ev.start}–${ev.end}`}
                      >
                        <div style={{ fontSize: 12, fontWeight: 700, whiteSpace: "normal", wordBreak: "break-word", lineHeight: 1.25, overflow: "hidden" }}>{ev.name}</div>
                        {<div style={{ fontSize: 10.5, color: "#B7BAC2", fontFamily: "'JetBrains Mono', monospace", marginTop: 2 }}>{ev.start}–{ev.end}</div>}
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "10px 16px", borderTop: "1px solid #2A2D35", color: "#5B5E68", fontSize: 11 }}>
              <Clock3 size={12} /> Tocá una actividad en la línea de tiempo para editarla.
            </div>
          </div>
        </div>
      </div>
    </div>

    {/* Vista de impresión: solo texto, sin colores — se muestra al hacer Ctrl/Cmd+P o "Guardar como PDF" */}
    <div className="cs-print-only" style={{ background: "#fff", color: "#000", fontFamily: "'Courier New', Courier, monospace", padding: "24px", fontSize: 12, lineHeight: 1.6 }}>
      <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 2 }}>CRONOGRAMA — {fmtDayLabel(date).toUpperCase()}</div>
      <div style={{ fontSize: 11, marginBottom: 16 }}>El Urqui Básquet — {events.length} actividad{events.length === 1 ? "" : "es"} · Ocupado {fmtDuration(busyMinutes)} · Libre {fmtDuration(freeMinutes)}</div>
      <div style={{ borderTop: "1px solid #000", marginBottom: 10 }} />
      {[...events].sort((a, b) => minutesFromTime(a.start) - minutesFromTime(b.start)).map(ev => (
        <div key={ev.id} style={{ marginBottom: 10 }}>
          <div>{ev.start} - {ev.end}   [{fmtDuration(minutesFromTime(ev.end) - minutesFromTime(ev.start))}]   ({catLabel(ev.category)})</div>
          <div style={{ fontWeight: 700 }}>{ev.name}</div>
        </div>
      ))}
      {events.length === 0 && <div>Sin actividades cargadas para este día.</div>}
      <div style={{ borderTop: "1px solid #000", marginTop: 10, paddingTop: 6, fontSize: 10 }}>
        Amanecer {hToClock(getSunData(date).sunriseH)} — Atardecer {hToClock(getSunData(date).sunsetH)}
      </div>
    </div>
    </>
  );
}

function StatChip({ label, value, accent = "#8A8D95" }) {
  return (
    <div style={{
      background: "#1D2027", border: "1px solid #2A2D35", borderRadius: 10,
      padding: "8px 14px", display: "flex", flexDirection: "column", minWidth: 90,
    }}>
      <span style={{ fontSize: 10.5, color: "#8A8D95", textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</span>
      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 16, fontWeight: 700, color: accent }}>{value}</span>
    </div>
  );
}

const navBtnStyle = {
  width: 36, height: 36, borderRadius: 9, background: "#1D2027", border: "1px solid #2A2D35",
  color: "#F2F1ED", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
};
const inputStyle = {
  width: "100%", background: "#14161B", border: "1px solid #2A2D35", borderRadius: 8,
  padding: "8px 10px", color: "#F2F1ED", fontSize: 13, outline: "none",
};
const labelStyle = { fontSize: 10.5, color: "#8A8D95", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 4, display: "block" };
const primaryBtnStyle = {
  flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
  background: "#FF8C42", color: "#14161B", border: "none", borderRadius: 8,
  padding: "9px 0", fontSize: 13, fontWeight: 700,
};
const secondaryBtnStyle = {
  background: "transparent", border: "1px solid #2A2D35", color: "#8A8D95", borderRadius: 8,
  padding: "9px 12px", cursor: "pointer",
};
const iconBtnStyle = {
  background: "transparent", border: "none", color: "#8A8D95", cursor: "pointer",
  padding: 4, display: "flex", alignItems: "center",
};
const warnStyle = { fontSize: 11, color: "#FFB454", marginTop: 8, lineHeight: 1.4 };

// ============================================================
// Plan financiero del torneo (mismo estilo visual que el cronograma)
// ============================================================

const FONT = "'Inter', system-ui, sans-serif";
const FONT_DISPLAY = "'Space Grotesk', sans-serif";
const FONT_MONO = "'JetBrains Mono', monospace";
const NARANJA = "#FF8C42";
const NEGRO = "#14161B";
const GRIS = "#1D2027";
const GRIS_CLARO = "#22252C";
const BORDE = "#2A2D35";
const BLANCO = "#F2F1ED";
const MUTED = "#8A8D95";
const CLARO = "#B7BAC2";
const VERDE = "#35D0BA";
const ROJO = "#FF6B6B";
const AZUL = "#5B9DFF";
const STORAGE_KEY = "urqui-torneo-7ma";

function Card({ title, children, accent }) {
  return (
    <div style={{ background: GRIS, border: `1px solid ${BORDE}`, borderRadius: 12, padding: "14px 16px", marginBottom: 10 }}>
      {title && <h3 style={{ color: accent ? NARANJA : CLARO, margin: "0 0 10px", fontSize: 11.5, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", fontFamily: FONT_DISPLAY }}>{title}</h3>}
      {children}
    </div>
  );
}

function Row({ label, value, sub, color, bold }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: "5px 0", borderBottom: `1px solid ${BORDE}`, gap: 10 }}>
      <span style={{ color: sub ? MUTED : BLANCO, fontSize: sub ? 11 : 12, fontStyle: sub ? "italic" : "normal", fontFamily: FONT }}>{label}</span>
      <span style={{ color: color || BLANCO, fontWeight: bold ? 700 : 500, fontSize: bold ? 12.5 : 12, fontFamily: FONT_MONO, whiteSpace: "nowrap" }}>{value}</span>
    </div>
  );
}

function Slider({ label, min, max, value, onChange, step = 1, prefix = "$", suffix = "" }) {
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
        <label style={{ color: CLARO, fontSize: 11.5, fontFamily: FONT }}>{label}</label>
        <span style={{ color: NARANJA, fontWeight: 700, fontSize: 12, fontFamily: FONT_MONO }}>{prefix}{value.toLocaleString("es-AR")}{suffix}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} style={{ width: "100%", accentColor: NARANJA, height: 4 }} />
    </div>
  );
}

function NumInput({ label, value, onChange, suffix = "" }) {
  return (
    <div style={{ marginBottom: 8 }}>
      <label style={{ color: CLARO, fontSize: 11.5, display: "block", marginBottom: 4, fontFamily: FONT }}>{label}</label>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
