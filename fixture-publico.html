<style>
:root{--navy:#0d1b2e;--navy2:#162440;--navy3:#1e3050;--red:#C8102E;--red2:#e8213f;--white:#f0f4fa;--white2:#c8d4e8;--muted:#6a7d99;--border:rgba(255,255,255,0.09);--gold:#f0c040;--green:#22c55e;--green2:#16a34a;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--navy);color:var(--white);font-family:'Montserrat','Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
header{background:linear-gradient(135deg,#0a1520,#1a0810);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--red);position:sticky;top:0;z-index:200;}
.hbrand{display:flex;align-items:center;gap:12px;}.hlogo{height:44px;width:auto;display:block;flex-shrink:0;}
.ht{font-size:16px;font-weight:900;}.ht span{color:var(--red);}
.hs{font-size:10px;color:var(--muted);margin-top:2px;}
.btn-reset{background:rgba(200,16,46,.15);color:var(--red2);border:1px solid rgba(200,16,46,.3);padding:8px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
nav{display:flex;background:var(--navy2);border-bottom:1px solid var(--border);}
.nb{flex:1;padding:13px 8px;font-size:11px;font-weight:700;color:var(--muted);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;text-align:center;font-family:inherit;letter-spacing:.3px;}
.nb.active{color:var(--white);border-bottom-color:var(--red);}
.screen{display:none;padding:16px;max-width:700px;margin:0 auto;}
.screen.active{display:block;}
.stitle{font-size:18px;font-weight:900;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.stitle span{color:var(--red);}
.gl{font-size:11px;font-weight:800;color:var(--red2);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;}
#imp-tray{display:none;background:var(--navy2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:16px;position:sticky;top:var(--navh,0px);z-index:150;}
.imp-h{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--white2);}
.imp-h span{background:var(--red);color:#fff;border-radius:10px;padding:1px 8px;margin-left:6px;font-size:11px;}
.imp-hint{font-size:11px;color:var(--muted);margin:3px 0 8px;}
.imp-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:140px;overflow-y:auto;}
.chip{background:var(--navy3);border:1px solid var(--border);color:var(--white);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;cursor:grab;user-select:none;touch-action:manipulation;}
.chip.used{opacity:.35;text-decoration:line-through;cursor:default;}
.chip.sel{background:var(--red);border-color:var(--red);color:#fff;}
.tir input.dz{outline:2px dashed var(--red);}
.tir{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.tnum{width:26px;height:26px;background:var(--navy3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0;}
input[type="text"]{flex:1;background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--white);font-family:inherit;font-weight:600;outline:none;transition:border-color .15s;}
input[type="text"]:focus{border-color:rgba(200,16,46,.5);}
input[type="text"]::placeholder{color:var(--muted);font-weight:500;}
input[type="text"]:disabled{opacity:.5;}
.sinp{width:46px;background:var(--navy3);border:1px solid var(--border);border-radius:8px;padding:9px 4px;font-size:18px;font-weight:800;color:var(--white);text-align:center;font-family:inherit;outline:none;-moz-appearance:textfield;}
.sinp::-webkit-outer-spin-button,.sinp::-webkit-inner-spin-button{-webkit-appearance:none;}
.sinp:focus{border-color:rgba(200,16,46,.5);}
.sinp.err{border-color:var(--red2);background:rgba(200,16,46,.12);}
.sinp:disabled{background:rgba(255,255,255,.03);color:var(--muted);cursor:default;border-color:transparent;}
.btn-p{width:100%;background:var(--red);color:#fff;border:none;padding:16px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px;font-family:inherit;transition:background .15s,transform .1s;}
.btn-p:hover{background:var(--red2);}
.btn-p:active{transform:scale(.98);}
.btn-s{width:100%;background:var(--navy3);color:var(--white2);border:1px solid var(--border);padding:14px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;}
.gc{background:var(--navy2);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;}
.gc-grid{display:flex;gap:0 16px;align-items:flex-start;}
.gc-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.btn-flip{margin-left:10px;font-size:11px;font-weight:700;color:var(--white2);background:var(--navy3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;font-family:inherit;vertical-align:middle;}
.btn-flip:active{transform:scale(.97);}
.gc-aro{font-size:13px;font-weight:800;color:var(--red2);letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:2px 0 10px;}
@media (max-width:760px){.gc-grid{flex-direction:column;}.gc-aro{padding-top:14px;}}
.gc-badge{display:none;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:6px;}
#sf{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;}
#screen-setup{max-width:860px;}
@media (max-width:600px){#sf{grid-template-columns:1fr;}}
/* Pantalla ancha: Grupo 1 | Grupo 2 | Grupo 3 | Grupo 4 usando todo el ancho */
@media (min-width:1250px){
  #screen-groups{max-width:none;}
  .gc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start;}
  .gc-col{display:contents;}
  .gc-aro{display:none;}
  .gc-badge{display:inline;}
  .gc.g0{order:1;}.gc.g1{order:2;}.gc.g2{order:3;}.gc.g3{order:4;}
  .gc{margin-bottom:0;}
}
.gch{padding:11px 16px;background:rgba(200,16,46,.1);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.gct{font-size:14px;font-weight:800;color:var(--red2);}
.gcp{font-size:11px;color:var(--muted);font-weight:600;}
.st{width:100%;border-collapse:collapse;font-size:12px;}
.st th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);letter-spacing:.5px;text-transform:uppercase;}
.st th:not(:first-child):not(:nth-child(2)){text-align:center;}
.st td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--white2);font-weight:500;}
.st td:not(:first-child):not(:nth-child(2)){text-align:center;}
.st tr:last-child td{border-bottom:none;}
.st .pos{width:22px;color:var(--muted);font-size:11px;font-weight:700;}
.st .tn{font-weight:700;color:var(--white);}
.st .pts{font-weight:800;color:var(--gold);}
.ms{padding:10px 14px;}
.mr{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--border);}
.mr:last-child{border-bottom:none;}
.mt{flex:1;font-size:12px;font-weight:700;color:var(--white2);text-align:right;}
.mt.r{text-align:left;}
.mt.win,.mt.lose{padding:7px 9px;border-radius:8px;}
.mt.win{background:rgba(34,197,94,.13);color:var(--green);}
.mt.lose{background:rgba(232,33,63,.13);color:var(--red2);}
.sinp.win{border-color:rgba(34,197,94,.65);background:rgba(34,197,94,.14);color:var(--green);}
.sinp.lose{border-color:rgba(232,33,63,.6);background:rgba(232,33,63,.13);color:var(--red2);}
.mvs{font-size:10px;color:var(--muted);font-weight:700;}
.mok{width:18px;color:var(--green);font-size:14px;text-align:center;flex-shrink:0;}
.emsg{font-size:10px;color:var(--red2);font-weight:600;text-align:center;padding:2px 0 4px;}
.bp{margin-bottom:22px;}
.bpt{font-size:13px;font-weight:800;color:var(--red2);margin-bottom:10px;letter-spacing:.5px;text-transform:uppercase;}
.bpt.gold{color:var(--gold);}
.bm{background:var(--navy2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.bm.done{border-color:rgba(34,197,94,.3);}
.bmh{padding:5px 12px;background:rgba(255,255,255,.03);font-size:10px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);letter-spacing:.5px;text-transform:uppercase;}
.bmr{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);gap:10px;}
.bmr:last-child{border-bottom:none;}
.bmr.win{background:rgba(34,197,94,.07);}
.bmn{flex:1;font-size:13px;font-weight:700;color:var(--white2);}
.bmn.win{color:var(--green);}
.bmn.tbd{color:var(--muted);font-style:italic;font-weight:500;font-size:12px;}
.bmerr{font-size:10px;color:var(--red2);font-weight:600;text-align:center;padding:3px 12px 6px;}
.champ{background:linear-gradient(135deg,rgba(240,192,64,.12),rgba(200,16,46,.08));border:1px solid rgba(240,192,64,.35);border-radius:16px;padding:24px;text-align:center;margin-bottom:20px;}
.champ-icon{font-size:44px;margin-bottom:6px;}
.champ-lbl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;}
.champ-name{font-size:26px;font-weight:900;color:var(--gold);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green2);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;z-index:999;transition:transform .3s;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.terr{background:var(--red);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;padding:20px;}
.mo.open{display:flex;}
.md{background:var(--navy2);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:300px;width:100%;text-align:center;}
.md h3{font-size:17px;font-weight:800;margin-bottom:8px;}
.md p{font-size:13px;color:var(--white2);margin-bottom:20px;font-weight:500;}
.mdb{display:flex;gap:10px;}
.btn-can{flex:1;background:var(--navy3);color:var(--white2);border:1px solid var(--border);padding:13px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-con{flex:1;background:var(--red);color:#fff;border:none;padding:13px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:13px;font-weight:500;line-height:1.7;}
.gsetup{margin-bottom:20px;}
/* Vista cruces (llaves en árbol) */
#screen-bracket.wide{max-width:none;}
.xvw{overflow-x:auto;padding-bottom:10px;}
.xv{--j:clamp(16px,1.7vw,30px);--w:clamp(132px,calc((100vw - 40px - 6*var(--j)) / 7),230px);--ln:#3b5578;min-width:calc(7*132px + 6*16px + 8px);}
.xhead{display:flex;margin-bottom:10px;}
.xhead span{width:var(--w);flex-shrink:0;text-align:center;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
.xhead span.gold{color:var(--gold);}
.xhead i{width:var(--j);flex-shrink:0;}
.xrow{display:flex;align-items:center;}
.xnode{display:flex;align-items:center;}
.xnode.r{flex-direction:row-reverse;}
.xkids{display:flex;flex-direction:column;justify-content:space-around;}
.xc{margin:6px 0;}
.xj{align-self:stretch;position:relative;width:var(--j);flex-shrink:0;}
.xj::before{content:'';position:absolute;left:0;width:50%;top:25%;bottom:25%;border:2px solid var(--ln);border-left:none;}
.xj::after{content:'';position:absolute;left:50%;right:0;top:50%;border-top:2px solid var(--ln);}
.xnode.r > .xj::before{left:auto;right:0;border:2px solid var(--ln);border-right:none;}
.xnode.r > .xj::after{left:0;right:50%;}
.xs{width:var(--j);border-top:2px solid var(--ln);flex-shrink:0;}
.xcenter{align-self:stretch;width:var(--w);flex-shrink:0;display:grid;grid-template-rows:1fr auto 1fr;}
.xchamp{align-self:end;justify-self:center;margin-bottom:14px;width:var(--w);text-align:center;border:2px solid var(--gold);border-radius:12px;padding:8px 6px;background:rgba(240,192,64,.08);}
.xchamp .xt{font-size:22px;line-height:1.1;}
.xchamp .xl{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
.xchamp .xn{font-size:13px;font-weight:900;color:var(--gold);word-break:break-word;}
.xthird{align-self:start;margin-top:14px;}
.xthird .xmed{font-size:11px;font-weight:800;color:#CD7F32;text-align:center;margin-top:5px;}
.gjump{display:none;}
.xhint{display:none;}
.xhead span{cursor:pointer;}
.xvw{-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
.xhead span{scroll-snap-align:start;}
/* Celular */
@media (max-width:760px){
  header{position:static;padding:12px 16px;}
  nav{position:sticky;top:0;z-index:190;}
  .screen{padding:12px;}
  .gjump{display:flex;gap:8px;position:sticky;top:var(--navh,46px);z-index:180;background:var(--navy);padding:8px 0 10px;margin:-4px 0 6px;}
  .gjump button{flex:1;background:var(--navy3);color:var(--white2);border:1px solid var(--border);border-radius:10px;padding:10px 0;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;}
  .gjump button:active{background:var(--red);color:#fff;}
  .gc{scroll-margin-top:calc(var(--navh,46px) + 56px);}
  #screen-groups{padding-left:0;padding-right:0;max-width:none;}
  #screen-groups .stitle{margin-left:12px;margin-right:12px;}
  #screen-groups .gjump{padding-left:12px;padding-right:12px;}
  #screen-groups .gc-grid{align-items:stretch;}
  #screen-groups .gc-col{width:100%;}
  #screen-groups .gc{border-radius:0;border-left:none;border-right:none;}
  .mr{padding:7px 0;}
  .xv{--w:150px;--j:20px;min-width:calc(7*150px + 6*20px);}
  .xhint{display:block;font-size:11px;color:var(--muted);margin:0 0 8px;}
  .podio{padding:10px;}
  .pl{width:70px;}
}
.podio{background:var(--navy2);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;margin-top:6px;}
.podio-t{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;text-align:center;}
.pr{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);}
.pr:last-child{border-bottom:none;}
.pm{font-size:20px;width:28px;text-align:center;flex-shrink:0;}
.pl{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);width:78px;flex-shrink:0;}
.pn{font-size:15px;font-weight:900;color:var(--white);min-width:0;word-break:break-word;}
.pr.p1 .pn{color:var(--gold);font-size:17px;}
.pn.tbd{color:var(--muted);font-weight:500;font-style:italic;font-size:13px;}
.xv .bm{width:var(--w);margin:0;border-radius:9px;}
.xv .bmh{padding:3px 8px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.xv .bmr{padding:6px 8px;gap:6px;}
.xv .bmn{font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.xv .bmn.tbd{font-size:10.5px;}
.xv .sinp{width:34px;font-size:14px;padding:5px 2px;border-radius:6px;}
.xv .bmerr{font-size:9px;padding:3px 8px;}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.embed-only{display:none;}
body.fx-embed .embed-only{display:inline-block;}
.btn-h{padding:8px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}

.btn-h-or{background:rgba(255,140,66,.15);color:#ff9a5c;border:1px solid rgba(255,140,66,.45);}

.hbtns.embed-only{display:none;}
body.fx-embed .hbtns.embed-only{display:flex;}
.tir input.card{cursor:grab;caret-color:transparent;user-select:none;-webkit-user-select:none;}.tir input.card:active{cursor:grabbing;}.tir input.libre{color:#4f5a72;background:#0e1527;border-style:dashed;border-color:#26314d;}.tir input.sel{border-color:var(--red);box-shadow:0 0 0 2px rgba(200,16,46,.45);}
.gc-nota{margin:14px auto 6px;text-align:center;font-size:10.5px;color:var(--muted);line-height:1.4;max-width:520px;}
.btn-h-green{background:rgba(53,208,186,.14);color:#4fdcc8;border:1px solid rgba(53,208,186,.45);}
body.fx-public .hbtns,body.fx-public #nav-setup,body.fx-public #btn-aro-flip{display:none!important;}
body.fx-public .screen input{pointer-events:none;}
#vote-box{max-width:760px;margin:0 auto;padding:0 16px;}
#vote-box:empty{display:none;}
.vb{background:var(--navy2);border:1px solid var(--border);border-radius:14px;padding:16px;margin:16px 0 4px;}
.vb h3{font-size:16px;font-weight:800;margin:0 0 4px;}
.vb .vs{font-size:11.5px;color:var(--muted);margin:0 0 12px;line-height:1.4;}
.vteams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.vteams button{background:var(--navy3);border:1px solid var(--border);color:var(--white);border-radius:10px;padding:10px 8px;font:700 12.5px Montserrat,sans-serif;cursor:pointer;}
.vteams button.on{background:var(--red);border-color:var(--red);color:#fff;}
.vgo{width:100%;margin-top:12px;background:var(--red);color:#fff;border:none;border-radius:10px;padding:13px;font:800 14px Montserrat,sans-serif;cursor:pointer;}
.vgo:disabled{opacity:.4;cursor:default;}
.vr{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px;}

.vr .vbar{flex:1;height:14px;background:var(--navy3);border-radius:7px;overflow:hidden;}

.vr.mine .vbar i{background:var(--red);}
.vr .vp{flex:0 0 40px;text-align:right;font-weight:800;}
.vnote{font-size:11px;color:var(--muted);margin-top:8px;}

<script>window.__FX_PUBLIC=true;window.__FX_STATE=null;</script>
<script>
// ── GUARDADO AUTOMATICO (parche de la app) ─────────────────────────────────────────────────
// Cada archivo descargado lleva un ID propio: sus datos no se mezclan con los de otra copia, y una descarga nueva sale en blanco.
// Todo lo que se carga se guarda solo en este navegador (funciona sin internet). No hay que tocar nada.
const FX=(()=>{
  const ID='publico';
  const KEY='urqui7b:'+(ID.indexOf('__')===0?'plantilla':ID);
  let avisado=false;
  function valid(st){return st&&Array.isArray(st.teams)&&st.teams.length===4&&Array.isArray(st.gm)&&st.br&&Array.isArray(st.br.oct);}
  function load(defState){
    // Modo embebido (dentro de la app, online): el estado lo trae la app y se guarda en la nube.
    if(window.__FX_PUBLIC){document.body.classList.add('fx-public');return valid(window.__FX_STATE)?window.__FX_STATE:defState();}
    if(window.__FX_EMBED){document.body.classList.add('fx-embed');return valid(window.__FX_STATE)?window.__FX_STATE:defState();}
    try{const t=localStorage.getItem(KEY);const j=t&&JSON.parse(t);if(j&&valid(j.state))return j.state;}catch(e){}
    if(valid(window.__FX_STATE))return window.__FX_STATE;
    return defState();
  }
  function save(st){
    if(window.__FX_PUBLIC)return;
    if(window.__FX_EMBED){try{parent.postMessage({fx:'save',state:JSON.parse(JSON.stringify(st))},'*');}catch(e){}return;}
    try{localStorage.setItem(KEY,JSON.stringify({savedAt:Date.now(),state:st}));}
    catch(e){
      if(!avisado){avisado=true;
        const d=document.createElement('div');d.id='fxwarn';
        d.textContent='⚠ Este navegador no permite guardar los datos: si cerrás el Fixture se pierden. Abrilo con Chrome o Edge.';
        d.style.cssText='position:sticky;top:0;z-index:300;background:#C8102E;color:#fff;font:700 12px Montserrat,sans-serif;text-align:center;padding:9px 12px';
        document.body.insertBefore(d,document.body.firstChild);}
    }
  }
  return{load,save};
})();

const OCTVOS_T=[
  {a:[1,0],b:[4,2]},{a:[1,1],b:[4,3]},{a:[1,2],b:[4,0]},{a:[1,3],b:[4,1]},
  {a:[2,0],b:[3,2]},{a:[2,1],b:[3,3]},{a:[2,2],b:[3,0]},{a:[2,3],b:[3,1]}
];

const EXAMPLE_TEAMS=[
  ['Equipo 1','Equipo 2','Equipo 3','Equipo 4'],
  ['Equipo 5','Equipo 6','Equipo 7','Equipo 8'],
  ['Equipo 9','Equipo 10','Equipo 11','Equipo 12'],
  ['Equipo 13','Equipo 14','Equipo 15','Equipo 16']
];

function defState(){
  return{
    teams: EXAMPLE_TEAMS.map(g=>[...g]),
    locked:false,
    aroFlip:false,
    gm:Array(4).fill(null).map(()=>[
      {a:0,b:1,sa:'',sb:'',err:''},{a:2,b:3,sa:'',sb:'',err:''},{a:0,b:2,sa:'',sb:'',err:''},
      {a:1,b:3,sa:'',sb:'',err:''},{a:0,b:3,sa:'',sb:'',err:''},{a:1,b:2,sa:'',sb:'',err:''}
    ]),
    br:{
      oct:Array(8).fill(null).map(()=>({ta:'',tb:'',sa:'',sb:'',w:'',err:''})),
      qua:Array(4).fill(null).map(()=>({ta:'',tb:'',sa:'',sb:'',w:'',err:''})),
      sem:Array(2).fill(null).map(()=>({ta:'',tb:'',sa:'',sb:'',w:'',err:''})),
      fin:{ta:'',tb:'',sa:'',sb:'',w:'',err:''},
      ter:{ta:'',tb:'',sa:'',sb:'',w:'',err:''}
    }
  };
}

let S=FX.load(defState);
function save(){FX.save(S);}

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  document.getElementById('nav-'+id).classList.add('active');
  if(id==='groups') renderGroups();
  if(id==='bracket') renderBracket();
  if(id==='setup') renderSetup();
}

// SETUP
function renderSetup(){
  let h='';
  for(let g=0;g<4;g++){
    h+=`<div class="gsetup"><div class="gl">Grupo ${g+1}</div>`;
    for(let t=0;t<4;t++){
      h+=`<div class="tir"><div class="tnum">${g*4+t+1}</div>
        <input type="text" placeholder="${(S.imp||[]).length?'Arrastrá un equipo acá':'Nombre del equipo'}" value="${esc(S.teams[g][t])}" id="ti-${g}-${t}" ${S.locked?'disabled':''} ${(S.imp||[]).length&&!S.locked?'readonly draggable="true" class="card"':''}></div>`;
    }
    h+='</div>';
  }
  document.getElementById('sf').innerHTML=h;
  bindSetupDnD();renderTray();
  const btn=document.getElementById('bst');
  if(S.locked){
    btn.textContent='Editar equipos';btn.onclick=unlockTeams;
    btn.style.cssText='width:100%;background:var(--navy3);color:var(--white2);border:1px solid var(--border);padding:16px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px;font-family:inherit;';
  } else {
    btn.textContent='Guardar equipos';btn.onclick=saveTeams;
    btn.style.cssText='width:100%;background:var(--red);color:#fff;border:none;padding:16px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-top:8px;font-family:inherit;';
  }
}

// ── EQUIPOS IMPORTADOS (bandeja): arrastrar o tocar un nombre y soltarlo/tocarlo en un casillero ──
let impSel=null;
function nombresActuales(){
  const out=[];
  for(let g=0;g<4;g++)for(let t=0;t<4;t++){
    const el=document.getElementById(`ti-${g}-${t}`);
    out.push((el?el.value:S.teams[g][t])||'');
  }
  return out.map(x=>x.trim());
}
function marcarLibres(){document.querySelectorAll('.tir input.card').forEach(i=>{const v=i.value.trim();i.classList.toggle('libre',v===''||/^Equipo \d+$/i.test(v));});}
function renderTray(){
  marcarLibres();
  const tr=document.getElementById('imp-tray');if(!tr)return;
  const imp=S.imp||[];
  if(!imp.length){tr.style.display='none';tr.innerHTML='';return;}
  tr.style.display='block';
  const usados=new Set(nombresActuales());
  tr.innerHTML=`<div class="imp-h">Equipos importados<span>${imp.length}</span></div>
    <div class="imp-hint">${S.locked?'Tocá "Editar equipos" para volver a acomodarlos.':'Arrastrá un equipo a un casillero (o tocalo y después tocá el casillero).'}</div>
    <div class="imp-chips">${imp.map((n,i)=>{const u=usados.has(n);return `<span class="chip${u?' used':''}${impSel===i?' sel':''}" data-i="${i}" draggable="${!S.locked&&!u}">${esc(n)}</span>`;}).join('')}</div>`;
  if(!tr._dz){tr._dz=1;
    tr.addEventListener('dragover',e=>{if(S.locked)return;e.preventDefault();});
    tr.addEventListener('drop',e=>{if(S.locked)return;const sl=e.dataTransfer.getData('text/slot');if(!sl)return;e.preventDefault();const el=document.getElementById(sl);if(el){el.value='';}renderTray();});
  }
  tr.querySelectorAll('.chip').forEach(c=>{
    const i=+c.dataset.i;
    c.addEventListener('dragstart',e=>{if(S.locked){e.preventDefault();return;}e.dataTransfer.setData('text/plain',imp[i]);e.dataTransfer.effectAllowed='copy';});
    c.addEventListener('click',()=>{if(S.locked||c.classList.contains('used'))return;impSel=(impSel===i?null:i);renderTray();});
  });
}
// Mover equipos ya puestos: arrastrar el numerito del casillero (o tocarlo y tocar el destino). Si el destino tiene un equipo, se intercambian.
let slotSel=null;
function swapSlots(fromId,toId){
  slotSel=null;
  const a=document.getElementById(fromId),b=document.getElementById(toId);
  if(a&&b&&a!==b){const t=a.value;a.value=b.value;b.value=t;}
  document.querySelectorAll('.tir input.sel').forEach(x=>x.classList.remove('sel'));
  renderTray();
}
function bindSlotMove(){
  document.querySelectorAll('.tir input.card').forEach(inp=>{
    inp.addEventListener('dragstart',e=>{
      if(S.locked||!inp.value.trim()){e.preventDefault();return;}
      e.dataTransfer.setData('text/slot',inp.id);e.dataTransfer.setData('text/plain',inp.value);e.dataTransfer.effectAllowed='move';
    });
  });
}
function bindSetupDnD(){
  bindSlotMove();
  document.querySelectorAll('.tir input').forEach(inp=>{
    inp.addEventListener('dragover',e=>{if(S.locked)return;e.preventDefault();inp.classList.add('dz');});
    inp.addEventListener('dragleave',()=>inp.classList.remove('dz'));
    inp.addEventListener('drop',e=>{
      if(S.locked)return;e.preventDefault();inp.classList.remove('dz');
      const sl=e.dataTransfer.getData('text/slot');
      if(sl){swapSlots(sl,inp.id);return;}
      const nm=e.dataTransfer.getData('text/plain');if(nm){inp.value=nm;impSel=null;renderTray();}
    });
    inp.addEventListener('click',()=>{
      if(S.locked)return;
      if(slotSel){if(slotSel===inp.id){slotSel=null;inp.classList.remove('sel');}else swapSlots(slotSel,inp.id);return;}
      if(impSel===null){
        if(inp.classList.contains('card')&&inp.value.trim()){slotSel=inp.id;inp.classList.add('sel');}
        return;
      }
      const nm=(S.imp||[])[impSel];if(nm){inp.value=nm;impSel=null;renderTray();}
    });
    inp.addEventListener('input',()=>renderTray());
  });
}
function syncTeamsFromInputs(){for(let g=0;g<4;g++)for(let t=0;t<4;t++){const el=document.getElementById(`ti-${g}-${t}`);if(el)S.teams[g][t]=el.value.trim();}}
window.fxSetImportados=function(names){
  syncTeamsFromInputs();
  const nuevo=(names||[]).map(n=>String(n).trim()).filter(Boolean);
  const viejo=S.imp||[];
  const enNuevo=new Set(nuevo);
  // Renombres: el equipo que ocupaba el mismo lugar en la lista y su nombre viejo ya no está -> se renombró; lo actualizo en los grupos.
  const ren={};
  nuevo.forEach((n,i)=>{const o=viejo[i];if(o&&o!==n&&!enNuevo.has(o))ren[o]=n;});
  let cambios=0;
  for(let g=0;g<4;g++)for(let t=0;t<4;t++){const v=S.teams[g][t];if(ren[v]){S.teams[g][t]=ren[v];cambios++;}}
  S.imp=nuevo;impSel=null;slotSel=null;save();renderSetup();
  if(cambios){try{if(S.locked)updateBracketTeams();}catch(e){}showToast(cambios+(cambios===1?' equipo renombrado':' equipos renombrados')+' ✓');}
};
window.fxGetState=function(){return JSON.parse(JSON.stringify(S));};

function unlockTeams(){S.locked=false;save();renderSetup();}

function saveTeams(){
  for(let g=0;g<4;g++)for(let t=0;t<4;t++){
    const el=document.getElementById(`ti-${g}-${t}`);
    if(el) S.teams[g][t]=el.value.trim();
  }
  for(let g=0;g<4;g++)for(let t=0;t<4;t++)
    if(!S.teams[g][t]){showToast('Completá todos los equipos','terr');return;}
  S.locked=true;save();renderSetup();
  updateBracketTeams();showToast('Equipos guardados ✓');
}

// STANDINGS
function tn(g,t){return S.teams[g][t]||`E${g*4+t+1}`;}

function calcSt(g){
  const teams=[0,1,2,3].map(t=>({idx:t,name:tn(g,t),pts:0,pf:0,pc:0,pl:0}));
  S.gm[g].forEach(m=>{
    const sa=parseInt(m.sa),sb=parseInt(m.sb);
    if(isNaN(sa)||isNaN(sb)||m.sa===''||m.sb==='') return;
    teams[m.a].pf+=sa;teams[m.a].pc+=sb;teams[m.a].pl++;
    teams[m.b].pf+=sb;teams[m.b].pc+=sa;teams[m.b].pl++;
    if(sa>sb){teams[m.a].pts+=2;teams[m.b].pts+=1;}
    else{teams[m.b].pts+=2;teams[m.a].pts+=1;}
  });
  // Desempate: puntos -> si empatan 2 equipos, el cruce directo -> diferencia de puntos -> puntos a favor.
  // Si empatan 3 o más equipos (cruces en ronda), se usa directamente la diferencia de puntos.
  const tieSize={};teams.forEach(t=>{tieSize[t.pts]=(tieSize[t.pts]||0)+1;});
  teams.sort((x,y)=>{
    if(y.pts!==x.pts) return y.pts-x.pts;
    if(tieSize[x.pts]===2){const h=h2h(g,x.idx,y.idx);if(h!==0) return h;}
    if((y.pf-y.pc)!==(x.pf-x.pc)) return(y.pf-y.pc)-(x.pf-x.pc);
    return y.pf-x.pf;
  });
  return teams;
}

function h2h(g,ia,ib){
  const m=S.gm[g].find(m=>(m.a===ia&&m.b===ib)||(m.a===ib&&m.b===ia));
  if(!m||m.sa===''||m.sb==='') return 0;
  const sa=parseInt(m.sa),sb=parseInt(m.sb);
  if(isNaN(sa)||isNaN(sb)) return 0;
  if(m.a===ia) return sa>sb?-1:sb>sa?1:0;
  return sb>sa?-1:sa>sb?1:0;
}

function doneCnt(g){return S.gm[g].filter(m=>m.sa!==''&&m.sb!==''&&!m.err).length;}

// BRACKET UPDATE
function updateBracketTeams(){
  if(!S.locked) return;
  const st=[0,1,2,3].map(g=>calcSt(g));
  OCTVOS_T.forEach((pair,i)=>{
    const[posA,gA]=pair.a,[posB,gB]=pair.b;
    const newA=st[gA][posA-1].name,newB=st[gB][posB-1].name;
    if(S.br.oct[i].ta!==newA||S.br.oct[i].tb!==newB){
      S.br.oct[i].ta=newA;S.br.oct[i].tb=newB;
      S.br.oct[i].sa='';S.br.oct[i].sb='';S.br.oct[i].w='';S.br.oct[i].err='';
      resetDown('oct',i);
    }
  });
  save();
}

function resetDown(phase,idx){
  if(phase==='oct'){
    const qi=Math.floor(idx/2),slot=idx%2===0?'ta':'tb';
    S.br.qua[qi][slot]='';S.br.qua[qi].sa='';S.br.qua[qi].sb='';S.br.qua[qi].w='';S.br.qua[qi].err='';
    resetDown('qua',qi);
  } else if(phase==='qua'){
    const si=Math.floor(idx/2),slot=idx%2===0?'ta':'tb';
    S.br.sem[si][slot]='';S.br.sem[si].sa='';S.br.sem[si].sb='';S.br.sem[si].w='';S.br.sem[si].err='';
    resetDown('sem',si);
  } else if(phase==='sem'){
    const slot=idx===0?'ta':'tb';
    S.br.fin[slot]='';S.br.fin.sa='';S.br.fin.sb='';S.br.fin.w='';S.br.fin.err='';
    S.br.ter[slot]='';S.br.ter.sa='';S.br.ter.sb='';S.br.ter.w='';S.br.ter.err='';
  }
}


// GROUPS RENDER
function toggleAroFlip(){S.aroFlip=!S.aroFlip;save();renderGroups();}
function renderGroups(){
  if(!S.locked){document.getElementById('gc').innerHTML='<div class="empty">Primero guardá los equipos<br>en la pestaña "Equipos".</div>';return;}
  function tarjeta(g){
    const st=calcSt(g),done=doneCnt(g);
    let c=`<div class="gc g${g}">
      <div class="gch"><div class="gct">Grupo ${g+1}<span class="gc-badge">· ${labels[g%2]}</span></div><div class="gcp">${done}/6 partidos</div></div>
      <table class="st">
        <tr><th class="pos">#</th><th>Equipo</th><th>PJ</th><th>Pts</th><th>Dif</th></tr>
        ${st.map((t,i)=>`<tr>
          <td class="pos">${i+1}</td><td class="tn">${esc(t.name)}</td><td>${t.pl}</td>
          <td class="pts">${t.pts}</td>
          <td style="color:${(t.pf-t.pc)>=0?'var(--green)':'var(--red2)'}">${t.pf-t.pc>=0?'+':''}${t.pf-t.pc}</td>
        </tr>`).join('')}
      </table>
      <div class="ms">`;
    S.gm[g].forEach((m,mi)=>{
      const na=esc(tn(g,m.a)),nb=esc(tn(g,m.b));
      const ok=m.sa!==''&&m.sb!==''&&!m.err;
      const wA=ok&&parseInt(m.sa)>parseInt(m.sb),wB=ok&&parseInt(m.sb)>parseInt(m.sa);
      const cA=ok?(wA?' win':' lose'):'',cB=ok?(wB?' win':' lose'):'';
      c+=`<div class="mr">
        <div class="mt${cA}">${na}</div>
        <input class="sinp${m.err?' err':''}${cA}" type="number" value="${m.sa}" placeholder=""
          min="0" max="21" inputmode="numeric"
          oninput="this.value=this.value.replace(/[^0-9]/g,'');if(parseInt(this.value)>21)this.value='21';"
          onchange="setGS(${g},${mi},'a',this.value)">
        <div class="mvs">vs</div>
        <input class="sinp${m.err?' err':''}${cB}" type="number" value="${m.sb}" placeholder=""
          min="0" max="21" inputmode="numeric"
          oninput="this.value=this.value.replace(/[^0-9]/g,'');if(parseInt(this.value)>21)this.value='21';"
          onchange="setGS(${g},${mi},'b',this.value)">
        <div class="mt r${cB}">${nb}</div>
      </div>
      ${m.err?`<div class="emsg">${m.err}</div>`:''}`;
    });
    c+='</div></div>';
    return c;
  }
  const labels=S.aroFlip?['Aro B','Aro A']:['Aro A','Aro B'];
  let h='<div class="gc-col"><div class="gc-aro">'+labels[0]+'</div>'+tarjeta(0)+tarjeta(2)+'</div>';
  h+='<div class="gc-col"><div class="gc-aro">'+labels[1]+'</div>'+tarjeta(1)+tarjeta(3)+'</div>';
  document.getElementById('gc').innerHTML=h;
}


function setGS(g,mi,side,val){
  const m=S.gm[g][mi];
  if(side==='a') m.sa=val; else m.sb=val;
  m.err='';
  const sa=parseInt(m.sa),sb=parseInt(m.sb);
  if(m.sa!==''&&m.sb!==''&&!isNaN(sa)&&!isNaN(sb)){
    if(sa===sb){
      m.err='No puede haber empate.';
    } else {
      const hi=Math.max(sa,sb),lo=Math.min(sa,sb);
      if(hi>=12 && (hi-lo)===1){
        m.err=`Diferencia de 1 con ${hi} — necesitás ${hi+1} para ganar.`;
      }
    }
  }
  if(!m.err) updateBracketTeams();
  save();renderGroups();
}

// BRACKET RENDER
// Posiciones finales: Campeón, 2° (perdedor de la final), 3° (ganador del 3° y 4°) y 4° (perdedor del 3° y 4°)
function podioData(){
  const f=S.br.fin,t=S.br.ter;
  return{p1:f.w||'',p2:f.w?(f.w===f.ta?f.tb:f.ta):'',p3:t.w||'',p4:t.w?(t.w===t.ta?t.tb:t.ta):''};
}
function podioHTML(){
  const p=podioData();
  if(!p.p1&&!p.p3) return '';
  const row=(cls,ico,lbl,n)=>`<div class="pr ${cls}"><span class="pm">${ico}</span><span class="pl">${lbl}</span><span class="pn${n?'':' tbd'}">${n?esc(n):'Por definir'}</span></div>`;
  return `<div class="podio"><div class="podio-t">Posiciones finales · 7ma Edición</div>`+
    row('p1','🏆','Campeón',p.p1)+row('p2','🥈','2° puesto',p.p2)+row('p3','🥉','3° puesto',p.p3)+row('p4','🏅','4° puesto',p.p4)+`</div>`;
}
function jumpG(g){const el=document.querySelector('.gc.g'+g);if(el) el.scrollIntoView({behavior:'smooth',block:'start'});}
function xJump(i){
  const wrap=document.querySelector('.xvw'),sp=document.querySelectorAll('.xhead span')[i];
  if(!wrap||!sp) return;
  wrap.scrollTo({left:wrap.scrollLeft+sp.getBoundingClientRect().left-wrap.getBoundingClientRect().left-4,behavior:'smooth'});
}
function setNavH(){const n=document.querySelector('nav');if(n) document.documentElement.style.setProperty('--navh',n.offsetHeight+'px');}
window.addEventListener('resize',setNavH);window.addEventListener('load',setNavH);
function toggleBrView(){S.brView=S.brView==='x'?'l':'x';save();renderBracket();}

// Vista cruces: árbol simétrico (octavos a los costados -> semifinales -> final al centro)
function xNode(phase,idx,right){
  const aros=['Aro A','Aro B','Aro A','Aro B','Aro A','Aro B','Aro A','Aro B'];
  const kids=phase==='sem'?[['qua',idx*2],['qua',idx*2+1]]:phase==='qua'?[['oct',idx*2],['oct',idx*2+1]]:[];
  const lab=phase==='oct'?`Octavo ${idx+1} · ${aros[idx]}`:phase==='qua'?`Cuarto ${idx+1} · ${aros[idx]}`:`Semifinal ${idx+1}`;
  let h=`<div class="xnode${right?' r':''}">`;
  if(kids.length) h+='<div class="xkids">'+kids.map(k=>xNode(k[0],k[1],right)).join('')+'</div><div class="xj"></div>';
  h+=`<div class="xc">${bmHTML(S.br[phase][idx],phase,idx,lab)}</div></div>`;
  return h;
}
function renderCross(){
  const head=['Octavos','Cuartos','Semifinal','Final','Semifinal','Cuartos','Octavos'].map((t,i)=>(i?'<i></i>':'')+`<span${t==='Final'?' class="gold"':''} onclick="xJump(${i})">${t}</span>`).join('');
  const pd=podioData();
  const champ=`<div class="xchamp"><div class="xt">🏆</div><div class="xl">Campeón</div><div class="xn">${pd.p1?esc(pd.p1):'—'}</div>${pd.p2?`<div class="xl" style="margin-top:6px;">🥈 2° puesto</div><div class="xn" style="color:var(--white2);font-size:12px;">${esc(pd.p2)}</div>`:''}</div>`;
  const third=`<div class="xthird">${bmHTML(S.br.ter,'ter',0,'3° y 4° puesto')}${pd.p3?`<div class="xmed">🥉 3° ${esc(pd.p3)}</div>`:''}${pd.p4?`<div class="xmed" style="color:var(--muted);">4° ${esc(pd.p4)}</div>`:''}</div>`;
  return `<div class="xhint">Deslizá hacia los costados o tocá una ronda para ir directo ↔</div><div class="xvw"><div class="xv"><div class="xhead">${head}</div><div class="xrow">
    ${xNode('sem',0,false)}<div class="xs"></div>
    <div class="xcenter">${champ}<div class="xc">${bmHTML(S.br.fin,'fin',0,'Final')}</div>${third}</div>
    <div class="xs"></div>${xNode('sem',1,true)}
  </div></div></div>`;
}

function renderBracket(){
  const xv=S.brView==='x';
  document.getElementById('screen-bracket').classList.toggle('wide',xv);
  const bb=document.getElementById('btn-br-view');if(bb) bb.textContent=xv?'☰ Vista lista':'▦ Vista cruces';
  if(!S.locked){document.getElementById('bc').innerHTML='<div class="empty">Primero guardá los equipos.</div>';return;}
  if(!S.br.oct[0].ta){document.getElementById('bc').innerHTML='<div class="empty">Guardá los equipos para ver la llave.<br>Se actualiza en tiempo real con los resultados.</div>';return;}
  if(xv){document.getElementById('bc').innerHTML=renderCross();return;}
  let h='';
  // Octavos: alternados Aro A / Aro B
  const octAros=['Aro A','Aro B','Aro A','Aro B','Aro A','Aro B','Aro A','Aro B'];
  h+=`<div class="bp"><div class="bpt">Octavos de final</div>`;
  S.br.oct.forEach((m,i)=>{h+=bmHTML(m,'oct',i,`Partido ${i+1} · ${octAros[i]}`);});
  // Cuartos: alternados Aro A / Aro B
  const quaAros=['Aro A','Aro B','Aro A','Aro B'];
  h+=`</div><div class="bp"><div class="bpt">Cuartos de final</div>`;
  S.br.qua.forEach((m,i)=>{h+=bmHTML(m,'qua',i,`Cuarto ${i+1} · ${quaAros[i]}`);});
  h+=`</div><div class="bp"><div class="bpt">Semifinales <span style="font-size:11px;font-weight:600;color:var(--muted);">· Aro A</span></div>`;
  S.br.sem.forEach((m,i)=>{h+=bmHTML(m,'sem',i,`Semifinal ${i+1}`);});
  h+=`</div><div class="bp"><div class="bpt" style="color:#CD7F32;">3° y 4° puesto <span style="font-size:11px;font-weight:600;color:var(--muted);">· Aro A</span></div>`;
  h+=bmHTML(S.br.ter,'ter',0,'3° y 4° puesto');
  h+=`</div><div class="bp"><div class="bpt gold">Final <span style="font-size:11px;font-weight:600;color:var(--muted);">· Aro A</span></div>`;
  h+=bmHTML(S.br.fin,'fin',0,'Final');
  h+='</div>';
  h+=podioHTML();
  document.getElementById('bc').innerHTML=h;
}

function bmHTML(m,phase,idx,label){
  const has=m.ta&&m.tb,done=m.w!=='',wA=done&&m.w===m.ta,wB=done&&m.w===m.tb;
  const ec=m.err?' err':'';
  const rA=`<div class="bmr${wA?' win':''}">
    <div class="bmn${wA?' win':''}${!m.ta?' tbd':''}" title="${esc(m.ta)}">${m.ta?esc(m.ta):'Por definir'}</div>
    <input class="sinp${ec}" type="number" value="${m.sa}" placeholder=""
      min="0" max="21" inputmode="numeric"
      oninput="this.value=this.value.replace(/[^0-9]/g,'');if(parseInt(this.value)>21)this.value='21';"
      ${!has?'disabled':''} onchange="setBS('${phase}',${idx},'a',this.value)">
  </div>`;
  const rB=`<div class="bmr${wB?' win':''}">
    <div class="bmn${wB?' win':''}${!m.tb?' tbd':''}" title="${esc(m.tb)}">${m.tb?esc(m.tb):'Por definir'}</div>
    <input class="sinp${ec}" type="number" value="${m.sb}" placeholder=""
      min="0" max="21" inputmode="numeric"
      oninput="this.value=this.value.replace(/[^0-9]/g,'');if(parseInt(this.value)>21)this.value='21';"
      ${!has?'disabled':''} onchange="setBS('${phase}',${idx},'b',this.value)">
  </div>`;
  return `<div class="bm${done?' done':''}">
    <div class="bmh">${label}${done?' ✓':''}</div>${rA}${rB}
    ${m.err?`<div class="bmerr">${m.err}</div>`:''}
  </div>`;
}

function setBS(phase,idx,side,val){
  const m=(phase==='fin'||phase==='ter')?S.br[phase]:S.br[phase][idx];
  if(side==='a') m.sa=val; else m.sb=val;
  m.err='';m.w='';
  const sa=parseInt(m.sa),sb=parseInt(m.sb);
  if(m.sa!==''&&m.sb!==''&&!isNaN(sa)&&!isNaN(sb)){
    if(sa===sb){
      m.err='No puede haber empate.';
    } else {
      const hi=Math.max(sa,sb),lo=Math.min(sa,sb);
      if(hi>=12 && (hi-lo)===1){
        m.err=`Diferencia de 1 con ${hi} — necesitás ${hi+1} para ganar.`;
      } else {
        m.w=sa>sb?m.ta:m.tb;
        if(phase!=='fin') propagate(phase,idx,m.w,phase==='sem'?(m.w===m.ta?m.tb:m.ta):undefined);
      }
    }
  }
  save();renderBracket();
}

function propagate(phase,idx,w,loser){
  if(phase==='oct'){
    const qi=Math.floor(idx/2),slot=idx%2===0?'ta':'tb';
    S.br.qua[qi][slot]=w;S.br.qua[qi].sa='';S.br.qua[qi].sb='';S.br.qua[qi].w='';S.br.qua[qi].err='';
    resetDown('qua',qi);
  } else if(phase==='qua'){
    const si=Math.floor(idx/2),slot=idx%2===0?'ta':'tb';
    S.br.sem[si][slot]=w;S.br.sem[si].sa='';S.br.sem[si].sb='';S.br.sem[si].w='';S.br.sem[si].err='';
    resetDown('sem',si);
  } else if(phase==='sem'){
    const slot=idx===0?'ta':'tb';
    S.br.fin[slot]=w;S.br.fin.sa='';S.br.fin.sb='';S.br.fin.w='';S.br.fin.err='';
    S.br.ter[slot]=loser;S.br.ter.sa='';S.br.ter.sb='';S.br.ter.w='';S.br.ter.err='';
  }
}


function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg,cls=''){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(cls?' '+cls:'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function confirmReset(){document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function doReset(){const _imp=S.imp;S=defState();S.imp=_imp;save();closeModal();go('setup');renderSetup();showToast('Todo reiniciado');}

// INIT
renderSetup();
if(S.locked) updateBracketTeams();
function valid2(st){return st&&Array.isArray(st.teams)&&st.teams.length===4&&Array.isArray(st.gm)&&st.br&&Array.isArray(st.br.oct);}
window.fxPublicUpdate=function(st){
  if(!valid2(st))return;S=st;
  const a=document.querySelector('.screen.active');let id=a?a.id.replace('screen-',''):'groups';
  if(id==='setup')id='groups';go(id);
};
if(window.__FX_PUBLIC){go('groups');}
</script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  var box=document.getElementById('vote-box');
  var abierto=false, todos=false, cfg={abierta:true,ronda:1}, res={counts:{}}, sel=null, voted=null, devId, db=null, msg='';
  try{devId=localStorage.getItem('urqui-dev');if(!devId){devId=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('urqui-dev',devId);}}catch(e){devId=Math.random().toString(36).slice(2)+Date.now().toString(36);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function vkey(){return 'urqui-voto-'+(cfg.ronda||1);}
  function miVoto(){try{return localStorage.getItem(vkey());}catch(e){return null;}}
  function equipos(st){var o=[];st.teams.forEach(function(g){g.forEach(function(n){if(n&&o.indexOf(n)<0)o.push(n);});});return o;}
  function render(){
    var st=window.fxGetState();
    if(!st.locked){box.innerHTML='<div class="vb"><h3>Fixture del torneo</h3><p class="vs" style="margin:0">Los equipos todavía no están cargados. Volvé en un rato.</p></div>';return;}
    var v=voted||miVoto(), abierta=cfg.abierta!==false, h='<div class="vb">';
    if(!v && abierta && !abierto){
      h+='<div id="vopen" style="display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:800;font-size:14px"><span>🏆 ¿Quién gana el torneo?</span><span style="background:var(--red);border-radius:8px;padding:7px 14px;font-size:12.5px">Votá acá</span></div>';
    } else if(!v && abierta){
      h+='<h3>🏆 ¿Quién gana el torneo?</h3><p class="vs">Votá a tu favorito. Es anónimo y se vota una sola vez por celular. Después del voto ves los resultados en vivo.</p><div class="vteams">';
      equipos(st).forEach(function(n,i){h+='<button data-i="'+i+'" class="'+(sel===n?'on':'')+'">'+esc(n)+'</button>';});
      h+='</div><button class="vgo" id="vgo"'+(sel?'':' disabled')+'>'+(sel?'Votar por '+esc(sel):'Elegí un equipo')+'</button>';
      if(msg)h+='<div class="vnote" style="color:#ff8a8a">'+esc(msg)+'</div>';
    } else {
      var c=res.counts||{}, names=equipos(st);Object.keys(c).forEach(function(n){if(names.indexOf(n)<0)names.push(n);});
      var tot=0;names.forEach(function(n){tot+=c[n]||0;});
      names.sort(function(a,b){return (c[b]||0)-(c[a]||0);});
      h+='<h3>🏆 ¿Quién gana el torneo?</h3><p class="vs">'+(abierta?'Resultados en vivo':'Votación cerrada')+' · '+tot+' '+(tot===1?'voto':'votos')+'</p>';
      var vis=todos?names:names.slice(0,5);
      vis.forEach(function(n){var p=tot?Math.round((c[n]||0)*100/tot):0;h+='<div class="vr'+(n===v?' mine':'')+'"><div class="vn">'+esc(n)+(n===v?' ✓':'')+'</div><div class="vbar"><i style="width:'+p+'%"></i></div><div class="vp">'+p+'%</div></div>';});
      if(names.length>5)h+='<div class="vnote" style="text-align:center"><a href="#" id="vall" style="color:#7db0ff">'+(todos?'Ver menos':'Ver todos los equipos')+'</a></div>';
      if(v)h+='<div class="vnote">Tu voto: '+esc(v)+'</div>';
    }
    h+='</div>';box.innerHTML=h;
    Array.prototype.forEach.call(box.querySelectorAll('.vteams button'),function(b){b.onclick=function(){sel=equipos(window.fxGetState())[+b.dataset.i];msg='';render();};});
    var go=document.getElementById('vgo');if(go)go.onclick=votar;
    var vo=document.getElementById('vopen');if(vo)vo.onclick=function(){abierto=true;render();};
    var va=document.getElementById('vall');if(va)va.onclick=function(e){e.preventDefault();todos=!todos;render();};
  }
  function votar(){
    if(!sel||!db)return;
    var s=sel;document.getElementById('vgo').disabled=true;
    db.collection('votosGanador').doc(devId+'_'+(cfg.ronda||1)).set({equipo:s,ts:Date.now()}).then(function(){
      voted=s;try{localStorage.setItem(vkey(),s);}catch(e){}
      res.counts=res.counts||{};res.counts[s]=(res.counts[s]||0)+1;render();
    }).catch(function(){msg='No se pudo registrar el voto. Si ya votaste desde este celular, no se puede votar de nuevo.';render();});
  }
  function chequear(){
    if(!db||miVoto())return;
    db.collection('votosGanador').doc(devId+'_'+(cfg.ronda||1)).get().then(function(d){if(d.exists){voted=d.data().equipo;try{localStorage.setItem(vkey(),voted);}catch(e){}render();}}).catch(function(){});
  }
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);db=firebase.firestore();
    var U=db.collection('urqui');
    U.doc('fixture-online').onSnapshot(function(s){if(s.exists){try{window.fxPublicUpdate(JSON.parse(s.data().value));}catch(e){}}render();});
    U.doc('votos-config').onSnapshot(function(s){var ant=cfg.ronda;if(s.exists){try{cfg=Object.assign({abierta:true,ronda:1},JSON.parse(s.data().value));}catch(e){}}if(cfg.ronda!==ant){voted=null;sel=null;}chequear();render();});
    U.doc('votos-resumen').onSnapshot(function(s){if(s.exists){try{res=JSON.parse(s.data().value)||{counts:{}};}catch(e){}}render();});
  }catch(e){box.innerHTML='<div class="vb"><p class="vs" style="margin:0">No se pudo conectar. Probá de nuevo en un rato.</p></div>';}
  render();
})();
</script>
